name: Investor Control Production Retrigger Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/investor-control-production-retrigger-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified production publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run investor-control-production-intelligence-v2.yml --ref main --repo "$GH_REPO"
          echo 'Verified production publisher dispatched.'
