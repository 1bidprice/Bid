name: Investor Control Production Retrigger Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/investor-control-production-retrigger-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified production publisher and record proof
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FOUNDATION_SHA="$(gh api "repos/$GH_REPO/branches/investor-control-v1-market-intelligence-foundation" --jq '.commit.sha')"
          gh workflow run investor-control-production-intelligence-v2.yml --ref main --repo "$GH_REPO"

          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "format": "investor-control-production-retrigger-proof",\n  "version": 1,\n  "generatedAt": "%s",\n  "dispatcherRunId": "%s",\n  "requestedFoundationSha": "%s",\n  "productionWorkflow": "investor-control-production-intelligence-v2.yml",\n  "dispatchRequested": true\n}\n' \
            "$GENERATED_AT" "$GITHUB_RUN_ID" "$FOUNDATION_SHA" > /tmp/retrigger-proof.json

          CONTENT="$(base64 -w0 /tmp/retrigger-proof.json)"
          API_PATH="repos/$GH_REPO/contents/ops/investor-control-production-retrigger-proof.json"
          EXISTING_SHA="$(gh api "$API_PATH?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" \
              -f message='ops: record production retrigger dispatch proof' \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" \
              -f branch='main' >/dev/null
          else
            gh api --method PUT "$API_PATH" \
              -f message='ops: record production retrigger dispatch proof' \
              -f content="$CONTENT" \
              -f branch='main' >/dev/null
          fi
          echo "Verified production publisher dispatched for foundation $FOUNDATION_SHA."
