name: Investor Control Core Stabilization

on:
  push:
    branches:
      - investor-control-core-stabilization-v174
    paths:
      - mobile/**
      - .github/workflows/investor-control-core-stabilization.yml
  pull_request:
    branches:
      - investor-control-v1-market-intelligence-foundation
    paths:
      - mobile/**
      - .github/workflows/investor-control-core-stabilization.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investor-control-core-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-capture-canonical-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and materialize current production source
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify canonical accounting and existing product contracts
        working-directory: mobile
        run: npm run test:core

      - name: Verify Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Export Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-core-stabilization

      - name: Capture materialized canonical source and exact generated diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf canonical-mobile-source
          mkdir -p canonical-mobile-source/mobile
          cp mobile/App.js canonical-mobile-source/mobile/App.js
          cp mobile/PortfolioApp.js canonical-mobile-source/mobile/PortfolioApp.js
          cp mobile/DecisionOverlay.js canonical-mobile-source/mobile/DecisionOverlay.js
          cp mobile/app.json canonical-mobile-source/mobile/app.json
          cp mobile/package.json canonical-mobile-source/mobile/package.json
          cp -R mobile/src canonical-mobile-source/mobile/src
          git diff -- mobile > canonical-mobile-source/generated-source.diff
          git diff --name-only -- mobile > canonical-mobile-source/generated-files.txt
          printf '%s\n' "${GITHUB_SHA}" > canonical-mobile-source/source-commit.txt
          cat canonical-mobile-source/generated-files.txt

      - name: Upload canonical source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-canonical-source-${{ github.sha }}
          path: canonical-mobile-source
          if-no-files-found: error
          retention-days: 14

      - name: Consolidate materialized source and retire production patch chain
        if: github.event_name == 'push' && github.ref == 'refs/heads/investor-control-core-stabilization-v174'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'mobile/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts = pkg.scripts || {};
          delete pkg.scripts.postinstall;
          pkg.scripts['test:canonical-source'] = 'node scripts/verify-canonical-source.cjs';
          pkg.scripts['test:core'] = 'npm run test:canonical-source && npm run test:accounting && npm run test:lots && npm run test:hunter-ui && npm run test:release-identity && npm run test:quote-transparency && npm run test:instrument-integrity';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          node mobile/scripts/verify-canonical-source.cjs

          git config user.name 'investor-control-stabilizer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            mobile/App.js \
            mobile/DecisionOverlay.js \
            mobile/PortfolioApp.js \
            mobile/app.json \
            mobile/package.json \
            mobile/src/FinalDecisionCard.js \
            mobile/src/OpportunitiesView.js \
            mobile/src/alert-engine.js \
            mobile/src/intelligence-feed-store.js \
            mobile/src/market-data.js \
            mobile/src/quote-contract.js

          if git diff --cached --quiet; then
            echo 'Canonical source already materialized; no consolidation commit required.'
            exit 0
          fi

          git commit -m 'Consolidate canonical mobile source and retire patch-chain runtime'
          git push origin HEAD:investor-control-core-stabilization-v174
