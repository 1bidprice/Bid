name: Controlled Signed Investor Control v0.6.4 APK

on:
  push:
    branches:
      - investor-control-v0.6.4-market-baseline
    paths:
      - .github/workflows/build-investor-control-v0.6.4-controlled.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investor-control-v064-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout v0.6.4 branch
        uses: actions/checkout@v4
        with:
          ref: investor-control-v0.6.4-market-baseline
          fetch-depth: 0

      - name: Publish active run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/build-metadata
          cat > .github/build-metadata/investor-control-v0.6.4-current-run.txt <<EOF
          status=RUNNING
          version=0.6.4
          versionCode=12
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          source_commit=${GITHUB_SHA}
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'Investor Control CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/build-metadata/investor-control-v0.6.4-current-run.txt
          git commit -m 'chore(mobile): record active v0.6.4 APK run [skip ci]'
          git pull --rebase origin investor-control-v0.6.4-market-baseline
          git push origin HEAD:investor-control-v0.6.4-market-baseline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify v0.6.4 source and regression
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-v064-market-baseline-fix.js
          grep -q "meta.previousClose || meta.chartPreviousClose" src/market-data.js
          ! grep -q "meta.chartPreviousClose || meta.previousClose" src/market-data.js
          grep -q "const referenceQuote = incomingChecked >= currentChecked" src/market-data.js
          grep -q "const VERSION = '0.6.4';" PortfolioApp.js
          grep -q "const VERSION = '0.6.4';" DecisionOverlay.js
          node -e "const p=((2.58-2.46)/2.46*100).toFixed(2); if(p!=='4.88') process.exit(1); console.log('PASS SPCE premarket '+p+'%')"

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='mobile/android/app/build/outputs/apk/release/app-release.apk'
          KEYSTORE='mobile/android/app/debug.keystore'
          OUTPUT='mobile/Investor-Control-v0.6.4.apk'
          ALIGNED='mobile/Investor-Control-v0.6.4-aligned.apk'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -s "$UNSIGNED"
          test -s "$KEYSTORE"
          unzip -l "$UNSIGNED" | grep -q 'assets/index.android.bundle'
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee mobile/Investor-Control-v0.6.4-signature.txt
          unzip -l "$OUTPUT" | grep -q 'assets/index.android.bundle'
          sha256sum "$OUTPUT" | tee mobile/Investor-Control-v0.6.4.sha256

      - name: Upload signed APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v0.6.4-controlled-signed-apk
          path: |
            mobile/Investor-Control-v0.6.4.apk
            mobile/Investor-Control-v0.6.4.sha256
            mobile/Investor-Control-v0.6.4-signature.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified artifact metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          SHA256_VALUE="$(cut -d' ' -f1 mobile/Investor-Control-v0.6.4.sha256)"
          cat > .github/build-metadata/investor-control-v0.6.4-current-run.txt <<EOF
          status=SIGNED_AND_VERIFIED
          version=0.6.4
          versionCode=12
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          source_commit=${GITHUB_SHA}
          artifact_id=${ARTIFACT_ID}
          artifact_name=investor-control-v0.6.4-controlled-signed-apk
          artifact_url=${ARTIFACT_URL}
          apk_sha256=${SHA256_VALUE}
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add .github/build-metadata/investor-control-v0.6.4-current-run.txt
          git commit -m 'chore(mobile): record verified v0.6.4 APK [skip ci]'
          git pull --rebase origin investor-control-v0.6.4-market-baseline
          git push origin HEAD:investor-control-v0.6.4-market-baseline
