name: MINBEIS Account Backend Production Activation

on:
  workflow_dispatch:
    inputs:
      confirm_accounts:
        description: 'Type ENABLE_ACCOUNTS to authorize account backend deployment'
        required: true
        type: string
      expected_sha:
        description: 'Exact commit SHA authorized for account backend deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: minbeis-account-backend-production
  cancel-in-progress: false

jobs:
  activate-account-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
      MINBEIS_TENANT_HMAC_SECRET: ${{ secrets.MINBEIS_TENANT_HMAC_SECRET }}
      FIREBASE_PROJECT_ID: ${{ vars.MINBEIS_FIREBASE_PROJECT_ID }}
      MINBEIS_ACCOUNTS_DB_ID: ${{ vars.MINBEIS_ACCOUNTS_DB_ID }}
      MINBEIS_ACCOUNTS_DB_NAME: ${{ vars.MINBEIS_ACCOUNTS_DB_NAME || 'minbeis-accounts' }}
      MINBEIS_ACCOUNT_PRODUCTION_ENABLED: ${{ vars.MINBEIS_ACCOUNT_PRODUCTION_ENABLED || 'false' }}

    steps:
      - name: Enforce explicit authorization and exact source
        shell: bash
        env:
          CONFIRM_ACCOUNTS: ${{ inputs.confirm_accounts }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRM_ACCOUNTS" = 'ENABLE_ACCOUNTS' || { echo 'Account activation confirmation is invalid.' >&2; exit 1; }
          test "$EXPECTED_SHA" = "$GITHUB_SHA" || { echo "Authorized SHA does not match workflow SHA: $GITHUB_SHA" >&2; exit 1; }
          test "$GITHUB_REF_NAME" = 'investor-control-minbeis-integration-v1' || { echo 'Account activation is restricted to the controlled MINBEIS integration branch.' >&2; exit 1; }
          test "$MINBEIS_ACCOUNT_PRODUCTION_ENABLED" = 'true' || { echo 'Repository variable MINBEIS_ACCOUNT_PRODUCTION_ENABLED must be true before activation.' >&2; exit 1; }

      - name: Require production credentials and identifiers
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test -n "${FINNHUB_TOKEN:-}" || { echo 'Missing FINNHUB_TOKEN.' >&2; exit 1; }
          test "${#MINBEIS_TENANT_HMAC_SECRET}" -ge 32 || { echo 'MINBEIS_TENANT_HMAC_SECRET is missing or too short.' >&2; exit 1; }
          test -n "${FIREBASE_PROJECT_ID:-}" || { echo 'Missing MINBEIS_FIREBASE_PROJECT_ID repository variable.' >&2; exit 1; }
          test -n "${MINBEIS_ACCOUNTS_DB_ID:-}" || { echo 'Missing MINBEIS_ACCOUNTS_DB_ID repository variable.' >&2; exit 1; }

      - name: Checkout exact authorized source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned gateway dependencies
        working-directory: market-intelligence
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Re-run account and gateway contracts
        working-directory: market-intelligence
        run: |
          set -euo pipefail
          node scripts/verify-canonical-source.js
          python3 gateway/scripts/verify-account-schema.py
          node --test \
            test/market-gateway.test.js \
            test/market-gateway-edge.test.js \
            test/tenant-contract.test.js \
            test/push-contract.test.js \
            test/account-api.test.js \
            test/expo-push-transport.test.js \
            test/account-provisioning-config.test.js \
            gateway/contracts/firebase-token-verifier.contract.mjs

      - name: Render account-enabled Worker config
        working-directory: market-intelligence/gateway
        run: |
          set -euo pipefail
          node scripts/render-account-enabled-wrangler.mjs wrangler.jsonc wrangler.accounts.generated.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('wrangler.accounts.generated.json','utf8'));if(p.vars?.MINBEIS_ACCOUNT_API_ENABLED!=='true'||!p.vars?.FIREBASE_PROJECT_ID||p.d1_databases?.find(x=>x.binding==='MINBEIS_ACCOUNTS_DB')==null)process.exit(2);"

      - name: Production bundle dry-run with account backend enabled
        working-directory: market-intelligence/gateway
        run: |
          set -euo pipefail
          rm -rf dist-accounts
          npx --yes wrangler@4.129.1 deploy --config wrangler.accounts.generated.json --dry-run --outdir dist-accounts
          find dist-accounts -type f | grep -Eq '\.(js|mjs)$'

      - name: Apply idempotent D1 account migration
        working-directory: market-intelligence/gateway
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.1 d1 execute MINBEIS_ACCOUNTS_DB \
            --remote \
            --config wrangler.accounts.generated.json \
            --file migrations/0001_minbeis_accounts.sql

      - name: Deploy account-enabled gateway with encrypted secrets
        id: deploy
        working-directory: market-intelligence/gateway
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_FILE="$(mktemp)"
          chmod 600 "$SECRETS_FILE"
          cleanup() { rm -f "$SECRETS_FILE" deployment.log; }
          trap cleanup EXIT
          SECRETS_FILE="$SECRETS_FILE" node - <<'NODE'
          const fs=require('fs');
          const provider=process.env.FINNHUB_TOKEN || '';
          const tenantSecret=process.env.MINBEIS_TENANT_HMAC_SECRET || '';
          if(!provider || tenantSecret.length < 32) process.exit(2);
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify({
            FINNHUB_TOKEN: provider,
            MINBEIS_TENANT_HMAC_SECRET: tenantSecret,
          }));
          NODE
          npx --yes wrangler@4.129.1 deploy \
            --config wrangler.accounts.generated.json \
            --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deployment.log | tail -n 1 || true)"
          test -n "$DEPLOYMENT_URL" || { echo 'Could not verify workers.dev deployment URL.' >&2; exit 1; }
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed health and private account boundary
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deployment_url }}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$URL/health" > health.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('health.json','utf8'));if(p.status!=='ok'||p.providers?.us!=='configured'||p.providers?.researchQueue!=='configured')process.exit(2);"

          CLIENT_ID="account_activation_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          STATUS="$(curl --silent --show-error -o account.json -w '%{http_code}' \
            -H "X-Investor-Control-Client: $CLIENT_ID" \
            "$URL/v1/account/alerts")"
          test "$STATUS" = '401' || { echo "Expected private account API 401 without bearer token, got $STATUS" >&2; cat account.json >&2; exit 1; }
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('account.json','utf8'));if(p.error?.code!=='AUTH_TOKEN_REQUIRED')process.exit(2);"
          rm -f health.json account.json

      - name: Verify market quote still works after account activation
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deployment_url }}"
          CLIENT_ID="account_activation_quote_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 \
            -H "X-Investor-Control-Client: $CLIENT_ID" \
            "$URL/v1/quote?symbol=SPCE.US" > quote.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('quote.json','utf8'));if(p.quote?.appSymbol!=='SPCE.US'||p.quote?.quoteContract?.identityVerified!==true)process.exit(2);"
          rm -f quote.json

      - name: Preserve account activation manifest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > minbeis-account-backend-activation.json <<EOF
          {
            "format": "minbeis-account-backend-activation",
            "version": 1,
            "sourceCommit": "$GITHUB_SHA",
            "deploymentUrl": "${{ steps.deploy.outputs.deployment_url }}",
            "accountApiEnabled": true,
            "firebaseProjectConfigured": true,
            "d1Binding": "MINBEIS_ACCOUNTS_DB",
            "tenantIsolation": "HMAC_PSEUDONYMOUS",
            "portfolioCloudSync": false,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload account activation manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minbeis-account-backend-activation-${{ github.sha }}
          path: minbeis-account-backend-activation.json
          if-no-files-found: error
          retention-days: 90
