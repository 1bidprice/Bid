name: Investor Control MINBEIS Integration

on:
  push:
    branches:
      - investor-control-minbeis-integration-v1
    paths:
      - market-intelligence/**
      - mobile/**
      - .github/workflows/investor-control-minbeis-integration.yml
  pull_request:
    branches:
      - investor-control-core-stabilization-v174
    paths:
      - market-intelligence/**
      - mobile/**
      - .github/workflows/investor-control-minbeis-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-minbeis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test market intelligence and MINBEIS integration
        working-directory: market-intelligence
        run: npm test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify mobile canonical core
        working-directory: mobile
        run: npm run test:core

      - name: Export Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-minbeis-integration
