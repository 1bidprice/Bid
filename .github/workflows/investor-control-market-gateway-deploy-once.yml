name: Investor Control Market Gateway Deploy Once

on:
  push:
    branches:
      - investor-control-core-stabilization-v174
    paths:
      - .github/workflows/investor-control-market-gateway-deploy-once.yml

permissions:
  contents: read

concurrency:
  group: investor-control-market-gateway-production
  cancel-in-progress: false

env:
  SOURCE_SHA: a2f7f66c1834e6c2f79e58af3395bc922cbf9c2e

jobs:
  deploy-production-gateway-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce exact audited source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'investor-control-core-stabilization-v174'
          test "$SOURCE_SHA" = 'a2f7f66c1834e6c2f79e58af3395bc922cbf9c2e'

      - name: Require deployment credentials without exposing values
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test -n "${FINNHUB_TOKEN:-}" || { echo 'Missing FINNHUB_TOKEN.' >&2; exit 1; }

      - name: Checkout exact audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-run canonical gateway contracts
        working-directory: market-intelligence
        run: |
          set -euo pipefail
          node --check gateway/src/core.js
          node --check gateway/src/edge.js
          node --check gateway/src/index.js
          node scripts/verify-canonical-source.js
          node --test test/market-gateway.test.js test/market-gateway-edge.test.js

      - name: Production bundle dry-run before deployment
        working-directory: market-intelligence/gateway
        run: |
          set -euo pipefail
          rm -rf dist
          npx --yes wrangler@4.129.1 deploy --dry-run --outdir dist
          find dist -type f | grep -Eq '\.(js|mjs)$'

      - name: Deploy Investor Control Worker and encrypted provider secret
        id: deploy
        working-directory: market-intelligence/gateway
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$(mktemp)"
          chmod 600 "$SECRETS_FILE"
          cleanup() { rm -f "$SECRETS_FILE" deployment.log; }
          trap cleanup EXIT
          SECRETS_FILE="$SECRETS_FILE" node -e "const fs=require('fs'); const token=process.env.FINNHUB_TOKEN || ''; if(!token) process.exit(2); fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify({FINNHUB_TOKEN: token}));"
          npx --yes wrangler@4.129.1 deploy --secrets-file "$SECRETS_FILE" 2>&1 | tee deployment.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deployment.log | tail -n 1 || true)"
          test -n "$DEPLOYMENT_URL" || { echo 'Could not verify workers.dev deployment URL from Wrangler output.' >&2; exit 1; }
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deployment_url }}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$URL/health" > health.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('health.json','utf8')); if(p.status!=='ok'||p.providers?.us!=='configured'||p.providers?.athens!=='official_delayed_15m'||p.providers?.fx!=='ecb_official_daily_reference') process.exit(1);"

      - name: Verify authoritative US quote through deployed edge
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deployment_url }}"
          CLIENT_ID="github_deploy_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 -H "X-Investor-Control-Client: $CLIENT_ID" "$URL/v1/quote?symbol=SPCE.US" > quote.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('quote.json','utf8')); const q=p.quote; if(p.requestedSymbol!=='SPCE.US'||q?.appSymbol!=='SPCE.US'||q?.currency!=='USD'||q?.quoteContract?.sourceApproved!==true||q?.quoteContract?.identityVerified!==true) process.exit(1);"

      - name: Verify official ECB EURUSD reference through deployed edge
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deployment_url }}"
          CLIENT_ID="github_deploy_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 -H "X-Investor-Control-Client: $CLIENT_ID" "$URL/v1/fx?pair=EURUSD" > fx.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('fx.json','utf8')); const r=p.reference; if(r?.pair!=='EURUSD'||r?.sourceQuality!=='OFFICIAL_DAILY_REFERENCE'||!(Number(r?.rate)>0)||r?.valuationReferenceEligible!==true||r?.transactionEligible!==false||r?.decisionEligible!==false) process.exit(1);"

      - name: Record non-secret deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deployment_url }}"
          node -e "const fs=require('fs'); fs.writeFileSync('gateway-deployment-evidence.json', JSON.stringify({format:'investor-control-market-gateway-deployment-evidence',sourceSha:process.env.SOURCE_SHA,deploymentUrl:process.env.URL,verified:{health:true,spceUs:true,ecbEurUsd:true},generatedAt:new Date().toISOString()},null,2));" 
        env:
          URL: ${{ steps.deploy.outputs.deployment_url }}

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-market-gateway-production-deployment
          path: gateway-deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
