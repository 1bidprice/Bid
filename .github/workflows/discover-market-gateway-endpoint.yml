name: Discover Investor Control Gateway Endpoint

on:
  push:
    branches:
      - investor-control-minbeis-integration-v1
    paths:
      - '.github/workflows/discover-market-gateway-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Cloudflare read credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Discover workers.dev endpoint and verify health
        id: discover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > subdomain.json
          SUBDOMAIN="$(node -e "const p=require('./subdomain.json'); if(!p.success||!p.result?.subdomain) process.exit(2); process.stdout.write(p.result.subdomain)")"
          URL="https://investor-control-market-gateway.$SUBDOMAIN.workers.dev"
          echo "gateway_url=$URL" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 2 --retry-delay 1 "$URL/health" > health.json
          node -e "const p=require('./health.json'); if(p.status!=='ok') process.exit(2);"
          cat > gateway-endpoint.json <<EOF
          {
            "format": "investor-control-market-gateway-endpoint",
            "version": 1,
            "gatewayUrl": "$URL",
            "healthVerified": true,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          rm -f subdomain.json health.json

      - name: Upload verified endpoint manifest
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-market-gateway-endpoint
          path: gateway-endpoint.json
          if-no-files-found: error
          retention-days: 7
