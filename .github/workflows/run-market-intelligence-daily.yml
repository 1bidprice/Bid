name: Run Market Intelligence Daily

on:
  push:
    branches:
      - investor-control-v1-market-intelligence-foundation
    paths:
      - market-intelligence/**
      - .github/workflows/run-market-intelligence-daily.yml
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

concurrency:
  group: market-intelligence-daily
  cancel-in-progress: false

jobs:
  daily-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout intelligence branch
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF extraction runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Run deterministic tests
        working-directory: market-intelligence
        run: npm test

      - name: Collect official evidence and build guarded candidates
        working-directory: market-intelligence
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: npm run run:daily

      - name: Verify report contract
        working-directory: market-intelligence
        run: |
          node - <<'NODE'
          const report = require('./out/daily-intelligence.json');
          if (report.format !== 'investor-control-daily-intelligence') throw new Error('wrong report format');
          if (report.version !== 3) throw new Error('wrong report version');
          if (!Array.isArray(report.signals)) throw new Error('signals missing');
          if (!Array.isArray(report.diagnostics)) throw new Error('diagnostics missing');
          if (!Array.isArray(report.fundamentalSnapshots)) throw new Error('fundamental snapshots missing');
          if (!Array.isArray(report.marketSnapshots)) throw new Error('market snapshots missing');
          if (!Array.isArray(report.historicalMarketMetrics)) throw new Error('historical market metrics missing');
          if (report.evidenceCount < 1) throw new Error('no official evidence collected');
          if (!Number.isInteger(report.documentReviewedCount)) throw new Error('document review count missing');
          if (!Number.isInteger(report.pdfReviewedCount)) throw new Error('PDF review count missing');
          if (!Number.isInteger(report.fundamentalSnapshotCount)) throw new Error('fundamental snapshot count missing');
          if (!Number.isInteger(report.marketSnapshotCount)) throw new Error('market snapshot count missing');
          if (!Number.isInteger(report.historicalMarketMetricsCount)) throw new Error('historical market metrics count missing');
          for (const signal of report.signals) {
            if (!signal.source?.sourceUrl) throw new Error('signal source missing');
            if (!['INDEX_DISCOVERY', 'DOCUMENT_REVIEWED', 'METRICS_CONFIRMED'].includes(signal.analysisStage)) {
              throw new Error('invalid analysis stage');
            }
            if (!signal.crossCheck || !signal.readiness) throw new Error('cross-check/readiness missing');
            if (signal.readiness.publishable !== false) throw new Error('premature signal marked publishable');
            if (signal.status !== 'DRAFT' || signal.suggestedAction !== 'WATCH') {
              throw new Error('unconfirmed evidence escaped the publication guard');
            }
          }
          console.log(`PASS: ${report.evidenceCount} evidence, ${report.documentReviewedCount} documents, ${report.pdfReviewedCount} PDFs, ${report.historicalMarketMetricsCount} historical metric sets, ${report.signalCount} guarded candidates`);
          NODE

      - name: Upload daily intelligence report
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-daily-intelligence-${{ github.run_id }}
          path: market-intelligence/out/daily-intelligence.json
          if-no-files-found: error
          retention-days: 90
