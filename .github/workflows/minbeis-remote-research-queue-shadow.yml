name: MINBEIS Remote Research Queue Shadow

on:
  push:
    branches:
      - investor-control-minbeis-integration-v1
    paths:
      - 'market-intelligence/**'
      - '.github/workflows/minbeis-remote-research-queue-shadow.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact source SHA to verify against the remote queue'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: minbeis-remote-research-queue-shadow
  cancel-in-progress: false

jobs:
  verify-remote-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Enforce exact source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Require read-only verification credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test -n "${SEC_USER_AGENT:-}" || { echo 'Missing SEC_USER_AGENT.' >&2; exit 1; }
          test -n "${FINNHUB_TOKEN:-}" || { echo 'Missing FINNHUB_TOKEN.' >&2; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF extraction runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Resolve deployed queue namespace without mutation
        id: namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESPONSE="$RUNNER_TEMP/kv-namespaces.json"
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100"             > "$RESPONSE"
          KV_ID="$(RESPONSE="$RESPONSE" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          if (payload?.success !== true || !Array.isArray(payload?.result)) throw new Error('Cloudflare KV namespace listing failed');
          const matches = payload.result.filter((item) => {
            const title = String(item?.title || '').toLowerCase();
            return title.includes('investor-control-market-gateway') && title.includes('minbeis_research_queue');
          });
          if (matches.length !== 1) throw new Error(`Expected exactly one MINBEIS research queue namespace, found ${matches.length}`);
          process.stdout.write(String(matches[0].id));
          NODE
          )"
          test -n "$KV_ID"
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"
          rm -f "$RESPONSE"

      - name: Capture queued symbols read-only
        working-directory: market-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: ${{ steps.namespace.outputs.kv_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          npx --yes wrangler@4.129.1 kv key list             --namespace-id "$KV_ID"             --remote             --prefix 'research:'             > out/research-queue-keys.json

          node - <<'NODE'
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync('out/research-queue-keys.json', 'utf8'));
          const names = (Array.isArray(keys) ? keys : []).map((item) => item?.name).filter((name) => String(name).startsWith('research:'));
          fs.writeFileSync('out/research-queue-key-names.txt', names.join('\n') + (names.length ? '\n' : ''));
          NODE

          : > out/research-queue-values.ndjson
          while IFS= read -r key; do
            test -n "$key" || continue
            VALUE="$(npx --yes wrangler@4.129.1 kv key get "$key" --namespace-id "$KV_ID" --remote --text)"
            printf '%s\n' "$VALUE" >> out/research-queue-values.ndjson
          done < out/research-queue-key-names.txt

          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('out/research-queue-values.ndjson', 'utf8').split(/\r?\n/).filter(Boolean);
          const records = raw.map((line) => JSON.parse(line));
          for (const record of records) {
            if (record?.privacy?.storesPortfolioData !== false || record?.privacy?.storesClientIdentity !== false) {
              throw new Error('Remote queue privacy invariant failed');
            }
          }
          fs.writeFileSync('out/remote-research-queue.json', JSON.stringify({
            format: 'minbeis-remote-research-queue-shadow',
            version: 1,
            capturedAt: new Date().toISOString(),
            readOnly: true,
            records,
          }, null, 2) + '\n');
          NODE
          rm -f out/research-queue-values.ndjson out/research-queue-key-names.txt

      - name: Run canonical engine with remote queue as focus input
        working-directory: market-intelligence
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          MINBEIS_RESEARCH_QUEUE_PATH: out/remote-research-queue.json
        run: |
          set -euo pipefail
          npm test
          node src/run-autonomous-intelligence.js out/remote-queue-autonomous-intelligence.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('out/remote-queue-autonomous-intelligence.json', 'utf8'));
          const resolution = report.researchQueueResolution;
          if (!resolution || resolution.decisionImpact !== 'FOCUS_UNIVERSE_ONLY') throw new Error('Research queue resolution missing or gained decision authority');
          if (Number(resolution.resolvedCount || 0) > Number(resolution.requestedCount || 0)) throw new Error('Research queue resolution count is inconsistent');
          fs.writeFileSync('out/remote-queue-shadow-summary.json', JSON.stringify({
            format: 'minbeis-remote-queue-shadow-summary',
            version: 1,
            generatedAt: report.generatedAt,
            requestedCount: resolution.requestedCount,
            resolvedCount: resolution.resolvedCount,
            blockedCount: resolution.blockedCount,
            results: resolution.results,
            noPublicationPerformed: true,
            noQueueMutationPerformed: true,
            noBrokerWritePerformed: true,
          }, null, 2) + '\n');
          NODE

      - name: Upload read-only queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minbeis-remote-research-queue-shadow-${{ github.run_id }}
          path: |
            market-intelligence/out/remote-research-queue.json
            market-intelligence/out/remote-queue-autonomous-intelligence.json
            market-intelligence/out/remote-queue-shadow-summary.json
          if-no-files-found: warn
          retention-days: 30
