name: Validate Market Intelligence v1.1

on:
  push:
    branches:
      - investor-control-v1-market-intelligence-foundation
      - investor-control-v1.1-unified-intelligence
    paths:
      - market-intelligence/**
      - .github/workflows/validate-market-intelligence-foundation.yml
  pull_request:
    paths:
      - market-intelligence/**
      - .github/workflows/validate-market-intelligence-foundation.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic intelligence tests
        working-directory: market-intelligence
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Verify v1.1 source and quote contracts
        working-directory: market-intelligence
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const governor = fs.readFileSync('src/source-governor.js', 'utf8');
          const quote = fs.readFileSync('src/canonical-market-quote.js', 'utf8');
          const feed = fs.readFileSync('src/mobile-intelligence-feed.js', 'utf8');
          if (!governor.includes('DETERMINISTIC_SOURCE_GOVERNOR')) throw new Error('source governor missing');
          if (!quote.includes('valuationEligible')) throw new Error('canonical quote contract missing');
          if (!feed.includes('quoteRegistry')) throw new Error('canonical quote registry missing from mobile feed');
          console.log('PASS v1.1 source governor, canonical quote contract and feed registry');
          NODE
      - name: Upload deterministic test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-test-output-${{ github.run_id }}
          path: market-intelligence/test-output.log
          if-no-files-found: error
          retention-days: 30
      - name: Parse JSON schemas
        working-directory: market-intelligence
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          for (const file of fs.readdirSync('schemas').filter((name) => name.endsWith('.json'))) {
            JSON.parse(fs.readFileSync(`schemas/${file}`, 'utf8'));
            console.log(`PASS ${file}`);
          }
          NODE
