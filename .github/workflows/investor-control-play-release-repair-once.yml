name: Investor Control Play Release Repair Once

on:
  push:
    branches:
      - investor-control-core-stabilization-v174
    paths:
      - .github/scripts/repair-play-release-signing.py
      - .github/workflows/investor-control-play-release-repair-once.yml

permissions:
  contents: write

concurrency:
  group: investor-control-play-release-repair-once
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact owner-authored source
        uses: actions/checkout@v4
        with:
          ref: investor-control-core-stabilization-v174
          fetch-depth: 0

      - name: Remove self-referential negative checks from replacement payload
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='.github/scripts/repair-play-release-signing.py'
          sed -i "/^[[:space:]]*! grep -q 'gr.investorcontrol.play'/d" "$SCRIPT"
          sed -i "/^[[:space:]]*! grep -q 'openssl rand -hex 32'/d" "$SCRIPT"
          sed -i "/^[[:space:]]*! grep -q 'keytool -genkeypair'/d" "$SCRIPT"

      - name: Apply stable Play release repair
        run: python3 .github/scripts/repair-play-release-signing.py

      - name: Verify repaired Play workflow contract
        shell: bash
        run: |
          set -euo pipefail
          WF='.github/workflows/verify-investor-control-play-aab.yml'
          grep -q 'gr.investorcontrol.app' "$WF"
          grep -q 'ANDROID_UPLOAD_KEYSTORE_BASE64' "$WF"
          grep -q 'sign_for_play' "$WF"
          grep -q 'play-preflight.aab' "$WF"
          ! grep -q 'gr.investorcontrol.play' "$WF"
          ! grep -q 'openssl rand -hex 32' "$WF"
          ! grep -q 'keytool -genkeypair' "$WF"
          ! grep -q 'Generate permanent Play upload key' "$WF"
          ! grep -q 'Encrypt upload-key recovery package' "$WF"

      - name: Commit repaired workflow and remove one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/scripts/repair-play-release-signing.py
          git rm .github/workflows/investor-control-play-release-repair-once.yml
          git add .github/workflows/verify-investor-control-play-aab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(play): restore stable upload signing and app identity'
          git push origin HEAD:investor-control-core-stabilization-v174
