name: Investor Control Play AAB Verification

on:
  pull_request:
    branches:
      - investor-control-v1-market-intelligence-foundation
    paths:
      - mobile/**
      - play-store/**
      - .github/workflows/verify-investor-control-play-aab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-control-play-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install and apply production chain
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate release source
        working-directory: mobile
        run: |
          set -euo pipefail
          npm run test:lots
          npx expo install --check
          npx expo-doctor@latest
          npx expo export --platform android --output-dir dist-play-aab
          node - <<'NODE'
          const fs = require('fs');
          const app = require('./app.json');
          const pkg = require('./package.json');
          const portfolio = fs.readFileSync('./PortfolioApp.js', 'utf8');
          if (app.expo.version !== '1.2.0' || app.expo.android.versionCode !== 23) throw new Error('legacy release version mismatch');
          if (app.expo.android.package !== 'gr.investorcontrol.app') throw new Error('legacy package mismatch');
          const plugin = app.expo.plugins.find((item) => Array.isArray(item) && item[0] === 'expo-build-properties');
          if (plugin?.[1]?.android?.targetSdkVersion !== 36 || plugin?.[1]?.android?.compileSdkVersion !== 36) throw new Error('API 36 config missing');
          if (plugin?.[1]?.android?.usesCleartextTraffic !== false) throw new Error('cleartext traffic not blocked');
          for (const permission of ['android.permission.SYSTEM_ALERT_WINDOW','com.google.android.c2dm.permission.RECEIVE']) {
            if (!app.expo.android.blockedPermissions.includes(permission)) throw new Error(`permission not blocked: ${permission}`);
          }
          if (pkg.version !== '1.2.0') throw new Error('package version mismatch');
          if (!portfolio.includes('Σημαντική ενημέρωση πριν τη χρήση')) throw new Error('mandatory risk notice missing');
          if (!portfolio.includes('https://1bidprice.github.io/Bid/privacy-policy.html')) throw new Error('privacy policy link missing');
          NODE

      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build legacy in-place update APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify legacy APK continuity, API and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/release/app-release.apk'
          UPDATE='mobile/Investor-Control-v1.2.0-update.apk'
          ALIGNED='mobile/Investor-Control-v1.2.0-aligned.apk'
          KEYSTORE='mobile/android/app/debug.keystore'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK" && test -s "$KEYSTORE"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$UPDATE" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$UPDATE" | tee mobile/Investor-Control-v1.2.0-update-signature.txt
          grep -qi 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' mobile/Investor-Control-v1.2.0-update-signature.txt
          "$BUILD_TOOLS/aapt2" dump badging "$UPDATE" | tee mobile/Investor-Control-v1.2.0-badging.txt
          grep -q "package: name='gr.investorcontrol.app' versionCode='23' versionName='1.2.0'" mobile/Investor-Control-v1.2.0-badging.txt
          grep -q "targetSdkVersion:'36'" mobile/Investor-Control-v1.2.0-badging.txt
          "$BUILD_TOOLS/aapt2" dump permissions "$UPDATE" | tee mobile/Investor-Control-v1.2.0-permissions.txt
          for forbidden in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CAMERA RECORD_AUDIO READ_CONTACTS WRITE_CONTACTS READ_PHONE_STATE CALL_PHONE READ_SMS SEND_SMS SYSTEM_ALERT_WINDOW; do
            ! grep -q "android.permission.${forbidden}" mobile/Investor-Control-v1.2.0-permissions.txt || { echo "forbidden permission ${forbidden}" >&2; exit 1; }
          done
          ! grep -q 'com.google.android.c2dm.permission.RECEIVE' mobile/Investor-Control-v1.2.0-permissions.txt || { echo 'unused push receive permission present' >&2; exit 1; }
          sha256sum "$UPDATE" | tee mobile/Investor-Control-v1.2.0-update.sha256

      - name: Create isolated Play package without risking legacy local data
        working-directory: mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text, app_count = re.subn(r'applicationId\s+["\']gr\.investorcontrol\.app["\']', 'applicationId "gr.investorcontrol.play"', text, count=1)
          text, code_count = re.subn(r'versionCode\s+23\b', 'versionCode 1', text, count=1)
          if app_count != 1 or code_count != 1:
              raise SystemExit(f'Play variant patch failed: applicationId={app_count}, versionCode={code_count}')
          path.write_text(text)
          PY
          grep -q 'applicationId "gr.investorcontrol.play"' android/app/build.gradle
          grep -q 'versionCode 1' android/app/build.gradle

      - name: Build Play Android App Bundle
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Validate isolated Play bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB_SOURCE='mobile/android/app/build/outputs/bundle/release/app-release.aab'
          AAB='mobile/Investor-Control-v1.2.0-play-unsigned.aab'
          test -s "$AAB_SOURCE"
          cp "$AAB_SOURCE" "$AAB"
          zip -d "$AAB" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
          curl --fail --location --silent --show-error 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar validate --bundle="$AAB"
          PLAY_PACKAGE="$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --module=base --xpath='/manifest/@package')"
          PLAY_VERSION_CODE="$(java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --module=base --xpath='/manifest/@android:versionCode')"
          test "$PLAY_PACKAGE" = 'gr.investorcontrol.play'
          test "$PLAY_VERSION_CODE" = '1'
          printf 'package=%s\nversionCode=%s\nversionName=1.2.0\ntargetSdk=36\n' "$PLAY_PACKAGE" "$PLAY_VERSION_CODE" | tee mobile/Investor-Control-v1.2.0-play-manifest.txt
          sha256sum "$AAB" | tee mobile/Investor-Control-v1.2.0-play-unsigned.sha256

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v1.2.0-verified-play-candidate
          path: |
            mobile/Investor-Control-v1.2.0-update.apk
            mobile/Investor-Control-v1.2.0-update.sha256
            mobile/Investor-Control-v1.2.0-update-signature.txt
            mobile/Investor-Control-v1.2.0-badging.txt
            mobile/Investor-Control-v1.2.0-permissions.txt
            mobile/Investor-Control-v1.2.0-play-unsigned.aab
            mobile/Investor-Control-v1.2.0-play-unsigned.sha256
            mobile/Investor-Control-v1.2.0-play-manifest.txt
            play-store/**
          if-no-files-found: error
          retention-days: 90
