name: Investor Control Play Release Candidate

on:
  push:
    branches:
      - investor-control-play-store-release
    paths:
      - mobile/**
      - market-intelligence/**
      - play-store/**
      - .github/workflows/verify-investor-control-play-aab.yml
  pull_request:
    branches:
      - investor-control-v1-market-intelligence-foundation
    paths:
      - mobile/**
      - market-intelligence/**
      - play-store/**
      - .github/workflows/verify-investor-control-play-aab.yml
  workflow_dispatch:
    inputs:
      sign_for_play:
        description: 'Create a Play-uploadable AAB using the protected Investor Control upload key'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: investor-control-play-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-play-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate autonomous intelligence
        working-directory: market-intelligence
        run: npm test

      - name: Install and apply production mobile chain
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate release source
        working-directory: mobile
        run: |
          set -euo pipefail
          npm run test:lots
          npm run test:quote-transparency
          npm run test:instrument-integrity
          npx expo install --check
          npx expo-doctor@latest
          npx expo export --platform android --output-dir dist-play-aab
          node - <<'NODE'
          const fs = require('fs');
          const app = require('./app.json');
          const pkg = require('./package.json');
          const portfolio = fs.readFileSync('./PortfolioApp.js', 'utf8');
          const decision = fs.readFileSync('./DecisionOverlay.js', 'utf8');
          if (app.expo.version !== '1.7.3' || app.expo.android.versionCode !== 31) throw new Error('current release version mismatch');
          if (app.expo.android.package !== 'gr.investorcontrol.app') throw new Error('app package mismatch');
          const plugin = app.expo.plugins.find((item) => Array.isArray(item) && item[0] === 'expo-build-properties');
          if (plugin?.[1]?.android?.targetSdkVersion !== 36 || plugin?.[1]?.android?.compileSdkVersion !== 36) throw new Error('API 36 config missing');
          if (plugin?.[1]?.android?.usesCleartextTraffic !== false) throw new Error('cleartext traffic not blocked');
          for (const permission of ['android.permission.SYSTEM_ALERT_WINDOW','com.google.android.c2dm.permission.RECEIVE']) {
            if (!app.expo.android.blockedPermissions.includes(permission)) throw new Error(`permission not blocked: ${permission}`);
          }
          if (pkg.version !== '1.7.3') throw new Error('mobile package version mismatch');
          if (!portfolio.includes("const VERSION = '1.7.3';")) throw new Error('PortfolioApp runtime version mismatch');
          if (!decision.includes("const VERSION = '1.7.3';")) throw new Error('DecisionOverlay runtime version mismatch');
          if (!portfolio.includes('function quoteHeadlineLabel(quote)')) throw new Error('dynamic quote headline missing');
          if (!portfolio.includes('Ο ακριβής χρόνος αυτής της τιμής δεν είναι επαληθευμένος.')) throw new Error('quote timestamp disclosure missing');
          if (!portfolio.includes('Σημαντική ενημέρωση πριν τη χρήση')) throw new Error('mandatory risk notice missing');
          if (!portfolio.includes('https://1bidprice.github.io/Bid/privacy-policy.html')) throw new Error('privacy policy link missing');
          if (portfolio.includes('Επικόλλησε το προσωπικό token')) throw new Error('personal provider token UI must not ship');
          NODE

      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build legacy in-place update APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify legacy APK continuity, API and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/release/app-release.apk'
          UPDATE='mobile/Investor-Control-v1.7.3-update.apk'
          ALIGNED='mobile/Investor-Control-v1.7.3-aligned.apk'
          KEYSTORE='mobile/android/app/debug.keystore'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK" && test -s "$KEYSTORE"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$UPDATE" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$UPDATE" | tee mobile/Investor-Control-v1.7.3-update-signature.txt
          grep -qi 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' mobile/Investor-Control-v1.7.3-update-signature.txt
          "$BUILD_TOOLS/aapt2" dump badging "$UPDATE" | tee mobile/Investor-Control-v1.7.3-badging.txt
          grep -q "package: name='gr.investorcontrol.app' versionCode='31' versionName='1.7.3'" mobile/Investor-Control-v1.7.3-badging.txt
          grep -q "targetSdkVersion:'36'" mobile/Investor-Control-v1.7.3-badging.txt
          "$BUILD_TOOLS/aapt2" dump permissions "$UPDATE" | tee mobile/Investor-Control-v1.7.3-permissions.txt
          for forbidden in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CAMERA RECORD_AUDIO READ_CONTACTS WRITE_CONTACTS READ_PHONE_STATE CALL_PHONE READ_SMS SEND_SMS SYSTEM_ALERT_WINDOW; do
            ! grep -q "android.permission.${forbidden}" mobile/Investor-Control-v1.7.3-permissions.txt || { echo "forbidden permission ${forbidden}" >&2; exit 1; }
          done
          ! grep -q 'com.google.android.c2dm.permission.RECEIVE' mobile/Investor-Control-v1.7.3-permissions.txt || { echo 'unused push receive permission present' >&2; exit 1; }
          sha256sum "$UPDATE" | tee mobile/Investor-Control-v1.7.3-update.sha256

      - name: Verify stable Play identity and signing contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./mobile/app.json').expo.android.package")" = 'gr.investorcontrol.app'
          test "$(node -p "require('./mobile/app.json').expo.android.versionCode")" = '31'
          grep -q 'ANDROID_UPLOAD_KEYSTORE_BASE64' .github/workflows/verify-investor-control-play-aab.yml
          ! grep -q 'gr.investorcontrol.play' .github/workflows/verify-investor-control-play-aab.yml
          ! grep -q 'openssl rand -hex 32' .github/workflows/verify-investor-control-play-aab.yml
          ! grep -q 'keytool -genkeypair' .github/workflows/verify-investor-control-play-aab.yml

      - name: Build Play preflight Android App Bundle
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Validate Play preflight bundle identity
        shell: bash
        run: |
          set -euo pipefail
          AAB_SOURCE='mobile/android/app/build/outputs/bundle/release/app-release.aab'
          PREFLIGHT_AAB='mobile/Investor-Control-v1.7.3-play-preflight.aab'
          test -s "$AAB_SOURCE"
          cp "$AAB_SOURCE" "$PREFLIGHT_AAB"
          zip -d "$PREFLIGHT_AAB" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
          if unzip -l "$PREFLIGHT_AAB" | grep -Eq 'META-INF/.*\.(RSA|DSA|EC|SF)$'; then
            echo 'Inherited AAB signature remains after sanitization' >&2
            exit 1
          fi
          curl --fail --location --silent --show-error 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar validate --bundle="$PREFLIGHT_AAB"
          PLAY_PACKAGE="$(java -jar /tmp/bundletool.jar dump manifest --bundle="$PREFLIGHT_AAB" --module=base --xpath='/manifest/@package')"
          PLAY_VERSION_CODE="$(java -jar /tmp/bundletool.jar dump manifest --bundle="$PREFLIGHT_AAB" --module=base --xpath='/manifest/@android:versionCode')"
          test "$PLAY_PACKAGE" = 'gr.investorcontrol.app'
          test "$PLAY_VERSION_CODE" = '31'
          printf 'package=%s\nversionCode=%s\nversionName=1.7.3\ntargetSdk=36\nsigningMode=preflight-unsigned\n' "$PLAY_PACKAGE" "$PLAY_VERSION_CODE" | tee mobile/Investor-Control-v1.7.3-play-preflight-manifest.txt
          sha256sum "$PREFLIGHT_AAB" | tee mobile/Investor-Control-v1.7.3-play-preflight.sha256

      - name: Require protected Investor Control upload-key secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_play }}
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${UPLOAD_KEYSTORE_BASE64:-}" || { echo 'Missing ANDROID_UPLOAD_KEYSTORE_BASE64' >&2; exit 1; }
          test -n "${UPLOAD_KEY_ALIAS:-}" || { echo 'Missing ANDROID_UPLOAD_KEY_ALIAS' >&2; exit 1; }
          test -n "${UPLOAD_KEYSTORE_PASSWORD:-}" || { echo 'Missing ANDROID_UPLOAD_KEYSTORE_PASSWORD' >&2; exit 1; }
          test -n "${UPLOAD_KEY_PASSWORD:-}" || { echo 'Missing ANDROID_UPLOAD_KEY_PASSWORD' >&2; exit 1; }

      - name: Sign and verify Play-uploadable Android App Bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_play }}
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/investor-control-upload.jks"
          SOURCE_AAB='mobile/Investor-Control-v1.7.3-play-preflight.aab'
          SIGNED_AAB='mobile/Investor-Control-v1.7.3-play-signed.aab'
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" >/dev/null
          cp "$SOURCE_AAB" "$SIGNED_AAB"
          jarsigner -keystore "$KEYSTORE" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -keypass "$UPLOAD_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 "$SIGNED_AAB" "$UPLOAD_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$SIGNED_AAB" | tee mobile/Investor-Control-v1.7.3-play-signature.txt
          grep -qi 'jar verified' mobile/Investor-Control-v1.7.3-play-signature.txt
          java -jar /tmp/bundletool.jar validate --bundle="$SIGNED_AAB"
          PLAY_PACKAGE="$(java -jar /tmp/bundletool.jar dump manifest --bundle="$SIGNED_AAB" --module=base --xpath='/manifest/@package')"
          PLAY_VERSION_CODE="$(java -jar /tmp/bundletool.jar dump manifest --bundle="$SIGNED_AAB" --module=base --xpath='/manifest/@android:versionCode')"
          test "$PLAY_PACKAGE" = 'gr.investorcontrol.app'
          test "$PLAY_VERSION_CODE" = '31'
          keytool -list -v -keystore "$KEYSTORE" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" | grep -E 'Alias name:|SHA1:|SHA256:|Valid from:' | tee mobile/Investor-Control-v1.7.3-upload-certificate.txt
          sha256sum "$SIGNED_AAB" | tee mobile/Investor-Control-v1.7.3-play-signed.sha256
          rm -f "$KEYSTORE"

      - name: Upload verified Play preflight
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v1.7.3-play-preflight
          path: |
            mobile/Investor-Control-v1.7.3-update.apk
            mobile/Investor-Control-v1.7.3-update.sha256
            mobile/Investor-Control-v1.7.3-update-signature.txt
            mobile/Investor-Control-v1.7.3-badging.txt
            mobile/Investor-Control-v1.7.3-permissions.txt
            mobile/Investor-Control-v1.7.3-play-preflight.aab
            mobile/Investor-Control-v1.7.3-play-preflight.sha256
            mobile/Investor-Control-v1.7.3-play-preflight-manifest.txt
            play-store/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play-signed release artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_for_play }}
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v1.7.3-play-signed
          path: |
            mobile/Investor-Control-v1.7.3-play-signed.aab
            mobile/Investor-Control-v1.7.3-play-signed.sha256
            mobile/Investor-Control-v1.7.3-play-signature.txt
            mobile/Investor-Control-v1.7.3-upload-certificate.txt
          if-no-files-found: error
          retention-days: 90
