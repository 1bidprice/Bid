name: Investor Control Production Observer Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/investor-control-production-observer-once.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record latest production workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run list \
            --workflow investor-control-production-intelligence-v2.yml \
            --limit 8 \
            --json databaseId,status,conclusion,event,createdAt,startedAt,updatedAt,headSha,headBranch,url,attempt,workflowName \
            --repo "$GH_REPO" > /tmp/runs.json

          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg generatedAt "$GENERATED_AT" '{format:"investor-control-production-run-observation",version:1,generatedAt:$generatedAt,runs:.}' /tmp/runs.json > /tmp/observation.json
          CONTENT="$(base64 -w0 /tmp/observation.json)"
          API_PATH="repos/$GH_REPO/contents/ops/investor-control-production-run-observation.json"
          EXISTING_SHA="$(gh api "$API_PATH?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message='ops: update production run observation' -f content="$CONTENT" -f sha="$EXISTING_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message='ops: record production run observation' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
