name: Recommendation Integrity Canonical Snapshot

on:
  push:
    branches:
      - investor-control-core-stabilization-v174
    paths:
      - market-intelligence/**
      - .github/workflows/recommendation-integrity-runtime-snapshot.yml
  pull_request:
    paths:
      - market-intelligence/**
      - .github/workflows/recommendation-integrity-runtime-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical source and execute recommendation tests
        working-directory: market-intelligence
        run: npm test
      - name: Capture canonical recommendation sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical-snapshot
          cp market-intelligence/src/final-action-policy.js canonical-snapshot/
          cp market-intelligence/src/research-dossier.js canonical-snapshot/
          cp market-intelligence/src/opportunity-engine.js canonical-snapshot/
          cp market-intelligence/src/opportunity-universe-scanner.js canonical-snapshot/
          cp market-intelligence/src/mobile-intelligence-feed.js canonical-snapshot/
          cp market-intelligence/src/opportunity-purchase-reconciliation.js canonical-snapshot/
          cp market-intelligence/scripts/verify-canonical-source.js canonical-snapshot/
          cp market-intelligence/package.json canonical-snapshot/
          test ! -e market-intelligence/config/runtime-release-manifest.json
          test ! -e market-intelligence/scripts/run-current-release.js
          test -z "$(find market-intelligence/scripts -maxdepth 1 -type f -name 'apply-v*.js' -print -quit)"
      - name: Upload canonical snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-integrity-canonical-snapshot-${{ github.run_id }}
          path: canonical-snapshot/
          if-no-files-found: error
          retention-days: 7
