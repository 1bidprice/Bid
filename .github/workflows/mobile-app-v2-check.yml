name: Validate Investor Control Mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-app-v2-check.yml'
      - '.github/workflows/minbeis-production-android.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_MARKET_GATEWAY_URL: ${{ vars.EXPO_PUBLIC_MARKET_GATEWAY_URL || 'https://investor-control-market-gateway.bidprice-alerts.workers.dev' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report market gateway build wiring
        shell: bash
        run: |
          if [ -n "${EXPO_PUBLIC_MARKET_GATEWAY_URL:-}" ]; then
            node -e "const u=new URL(process.env.EXPO_PUBLIC_MARKET_GATEWAY_URL); if(u.protocol!=='https:') process.exit(2); console.log('Canonical gateway URL is wired into this validation build');"
          else
            echo 'Canonical gateway URL is not configured for this validation environment.'
          fi

      - name: Verify v1.7 Opportunity Hunter mobile contract
        run: npm run test:hunter-ui

      - name: Verify v1.7.1+ portfolio-aware release contract
        run: npm run test:release-identity

      - name: Verify v1.7.2 quote timing transparency
        run: npm run test:quote-transparency

      - name: Verify Product Recovery privacy data and history
        run: npm run test:local-data-ownership && npm run test:portfolio-history && npm run test:portfolio-data-flow && npm run test:portfolio-insights

      - name: Verify signed production candidate workflow safety
        shell: bash
        working-directory: ..
        run: |
          set -euo pipefail
          WF='.github/workflows/minbeis-production-android.yml'
          test -f "$WF"
          grep -q '^  workflow_dispatch:' "$WF"
          ! grep -Eq '^  (push|pull_request|schedule):' "$WF"
          grep -Fq 'BUILD_SIGNED' "$WF"
          grep -Fq 'expected_sha' "$WF"
          grep -Fq 'ANDROID_UPLOAD_KEYSTORE_BASE64' "$WF"
          grep -Fq 'patch-release-signing.cjs' "$WF"
          grep -Fq 'bundleRelease assembleRelease' "$WF"
          grep -Fq 'debugCertificateRejected' "$WF"
          grep -Fq 'playProductionReleased' "$WF"
          ! grep -Eqi 'play.*upload|publish.*play|production release' "$WF"

      - name: Check Expo package compatibility
        run: npx expo install --check 2>&1 | tee package-check.log

      - name: Expo Doctor
        continue-on-error: true
        run: npx expo-doctor 2>&1 | tee doctor.log

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist 2>&1 | tee export.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-validation-logs
          path: |
            mobile/package-check.log
            mobile/doctor.log
            mobile/export.log
          if-no-files-found: ignore
