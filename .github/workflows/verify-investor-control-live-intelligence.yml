name: Investor Control Live Intelligence Verification

on:
  push:
    branches:
      - investor-control-play-store-release
    paths:
      - market-intelligence/**
      - .github/workflows/verify-investor-control-live-intelligence.yml
  pull_request:
    branches:
      - investor-control-v1-market-intelligence-foundation
    paths:
      - market-intelligence/**
      - .github/workflows/verify-investor-control-live-intelligence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-control-live-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF extraction runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Capture complete official Athens source HTML
        shell: bash
        run: |
          set -euo pipefail
          ROOT='market-intelligence/out/athens-source'
          mkdir -p "$ROOT/trading-pages" "$ROOT/trading-letters"
          curl_source() {
            local url="$1"
            local output="$2"
            curl --fail --location --silent --show-error \
              -H 'Accept: text/html,application/xhtml+xml' \
              -H 'User-Agent: Investor-Control-Market-Intelligence/1.2' \
              "$url" -o "$output"
          }
          curl_source 'https://athens.euronext.com/en/market-data/issuers?letter=X' "$ROOT/issuers.html"
          curl_source 'https://athens.euronext.com/en/market-data/announcements' "$ROOT/announcements.html"
          curl_source 'https://athens.euronext.com/en/trade/trading-products/trading-issuers?letter=All' "$ROOT/trading-issuers.html"
          for page in $(seq 0 20); do
            curl_source "https://athens.euronext.com/en/trade/trading-products/trading-issuers?letter=All&page=${page}" "$ROOT/trading-pages/page-${page}.html"
          done
          for letter in A F H M P V; do
            curl_source "https://athens.euronext.com/en/trade/trading-products/trading-issuers?letter=${letter}" "$ROOT/trading-letters/${letter}.html"
          done
          grep -qi '<tr' "$ROOT/trading-issuers.html"
          grep -qi 'OASIS Code' "$ROOT/trading-issuers.html"
          wc -c "$ROOT"/*.html "$ROOT"/trading-pages/*.html "$ROOT"/trading-letters/*.html

      - name: Apply contracts, test and run live autonomous intelligence
        working-directory: market-intelligence
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm test
          mkdir -p out
          node src/run-autonomous-intelligence.js out/autonomous-intelligence.json
          node src/build-mobile-feed.js out/autonomous-intelligence.json out/mobile-intelligence-feed.json

      - name: Audit generated Athens parser against captured directory
        working-directory: market-intelligence
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { extractAthensTradingDirectory } from './src/adapters/euronext-athens-discovery.js';
          const pageDir = './out/athens-source/trading-pages';
          const html = fs.readdirSync(pageDir)
            .filter((name) => name.endsWith('.html'))
            .sort((a, b) => Number(a.match(/\d+/)?.[0]) - Number(b.match(/\d+/)?.[0]))
            .map((name) => fs.readFileSync(path.join(pageDir, name), 'utf8'))
            .join('\n');
          const parsed = extractAthensTradingDirectory(html);
          const targets = ['FLEXOPACK', 'PUBLIC POWER', 'VIOHALCO', 'HELLENIQ', 'AKTOR', 'PRODEA', 'MOTOR OIL'];
          const targetRecords = parsed.records.filter((item) => targets.some((target) => item.issuerName.toUpperCase().includes(target)));
          fs.writeFileSync('./out/athens-directory-parser-audit.json', JSON.stringify({
            recordCount: parsed.records.length,
            diagnostics: parsed.diagnostics,
            targetRecords,
          }, null, 2));
          if (parsed.records.length < 100) throw new Error(`official directory parser incomplete: ${parsed.records.length}`);
          for (const required of ['FLEXO', 'PPC', 'VIO', 'ELPE', 'PRODEA', 'MOH']) {
            if (!targetRecords.some((item) => item.symbol === required)) throw new Error(`official directory symbol missing: ${required}`);
          }
          NODE

      - name: Verify live Athens and source contracts
        working-directory: market-intelligence
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = require('./out/autonomous-intelligence.json');
          const feed = require('./out/mobile-intelligence-feed.json');
          const discovery = report.discovery || {};
          const sourceHealth = feed.sourceHealth || {};
          const tradingHtml = fs.readFileSync('./out/athens-source/trading-issuers.html', 'utf8');
          if (report.version !== 8) throw new Error(`unexpected report version ${report.version}`);
          if (discovery.sourcePolicy?.selector !== 'DETERMINISTIC_SOURCE_GOVERNOR') throw new Error('source governor missing');
          if (!Array.isArray(discovery.marketsScanned) || !discovery.marketsScanned.includes('US') || !discovery.marketsScanned.includes('GR')) throw new Error('US/GR scanning not active');
          if (Number(discovery.secRegistryCompanyCount || 0) < 1000) throw new Error('SEC universe incomplete');
          if (Number(discovery.athensActiveIssuerCount || 0) < 1) throw new Error(`Athens issuer discovery empty: ${discovery.athensActiveIssuerCount}`);
          if (Number(discovery.athensAnnouncementEventCount || 0) < 1) throw new Error(`Athens announcement discovery empty: ${discovery.athensAnnouncementEventCount}`);
          if (!/<tr\b/i.test(tradingHtml) || !/OASIS Code/i.test(tradingHtml)) throw new Error('official populated Athens trading directory is not readable');
          const greekCandidates = (discovery.shortlist || []).filter((item) => item.market === 'GR');
          const identifiedGreek = greekCandidates.filter((item) => item.symbol && item.identityStatus !== 'SYMBOL_RESOLUTION_REQUIRED');
          fs.writeFileSync('./out/athens-identity-audit.json', JSON.stringify({ greekCandidates, identifiedGreek }, null, 2));
          if (greekCandidates.length && identifiedGreek.length < Math.ceil(greekCandidates.length * 0.8)) {
            throw new Error(`Athens identity coverage below 80%: ${identifiedGreek.length}/${greekCandidates.length}`);
          }
          for (const item of feed.discoveryRadar || []) {
            if (item.suggestedAction !== 'WATCH') throw new Error('discovery leaked directional action');
          }
          for (const item of feed.decisions || []) {
            if (item.finalAction?.status === 'BLOCKED' && item.finalAction?.marketAction !== 'WATCH') throw new Error('blocked decision leaked direction');
          }
          console.log(JSON.stringify({
            generatedAt: report.generatedAt,
            secCompanies: discovery.secRegistryCompanyCount,
            athensIssuers: discovery.athensActiveIssuerCount,
            athensAnnouncements: discovery.athensAnnouncementEventCount,
            greekCandidates: greekCandidates.length,
            identifiedGreek: identifiedGreek.length,
            unresolvedGreek: greekCandidates.length - identifiedGreek.length,
            marketSnapshots: sourceHealth.marketSnapshotCount,
            fundamentals: sourceHealth.fundamentalSnapshotCount,
            finalActions: feed.summary?.finalActionCount,
            blocked: feed.summary?.blockedDecisionCount,
          }, null, 2));
          NODE

      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v1.2.5-live-intelligence-evidence
          path: |
            market-intelligence/out/autonomous-intelligence.json
            market-intelligence/out/mobile-intelligence-feed.json
            market-intelligence/out/athens-identity-audit.json
            market-intelligence/out/athens-directory-parser-audit.json
            market-intelligence/out/athens-source/**
            market-intelligence/src/adapters/euronext-athens-discovery.js
          if-no-files-found: warn
          retention-days: 30
