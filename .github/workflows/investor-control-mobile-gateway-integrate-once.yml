name: Investor Control Mobile Gateway Integrate Once

on:
  push:
    branches:
      - investor-control-core-stabilization-v174
    paths:
      - .github/scripts/integrate-mobile-canonical-market-gateway.py
      - .github/workflows/investor-control-mobile-gateway-integrate-once.yml

permissions:
  contents: write

concurrency:
  group: investor-control-mobile-gateway-integrate-once
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact owner-authored source
        uses: actions/checkout@v4
        with:
          ref: investor-control-core-stabilization-v174
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic gateway integration
        run: python3 .github/scripts/integrate-mobile-canonical-market-gateway.py

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify full mobile canonical core
        working-directory: mobile
        run: npm run test:core

      - name: Verify Android Metro export with dormant gateway integration
        working-directory: mobile
        env:
          EXPO_PUBLIC_MARKET_GATEWAY_URL: https://gateway.invalid.example
        run: |
          set -euo pipefail
          rm -rf /tmp/investor-control-gateway-export
          npx expo export --platform android --output-dir /tmp/investor-control-gateway-export
          test -d /tmp/investor-control-gateway-export

      - name: Commit verified integration and remove one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/integrate-mobile-canonical-market-gateway.py
          git rm .github/workflows/investor-control-mobile-gateway-integrate-once.yml
          git add mobile/src/market-data.js mobile/src/background-alert-task.js mobile/PortfolioApp.js mobile/package.json mobile/scripts/verify-market-gateway-runtime-integration.cjs
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mobile): wire dormant canonical market gateway runtime'
          git push origin HEAD:investor-control-core-stabilization-v174
