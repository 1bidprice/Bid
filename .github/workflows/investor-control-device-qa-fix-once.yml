name: Investor Control Device QA Fix Once

on:
  push:
    branches:
      - investor-control-core-stabilization-v174
    paths:
      - .github/workflows/investor-control-device-qa-fix-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: investor-control-core-stabilization-v174
          fetch-depth: 0

      - name: Apply deterministic device QA fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'mobile/src/quote-contract.js',
              "    quality: role === SOURCE_ROLES.PRIMARY_EXCHANGE ? 'delayed15' : 'realtime',\n    session: 'regular-market',\n    priceTimestampVerified: inherited?.timestampVerified === true,",
              "    quality: role === SOURCE_ROLES.PRIMARY_EXCHANGE ? 'delayed15' : 'realtime',\n    session: 'regular-market',\n    advertisedDelayMinutes: Math.max(0, Number(entry.advertisedDelayMinutes ?? inherited?.advertisedDelayMinutes ?? 0)),\n    priceTimestampVerified: inherited?.timestampVerified === true,",
          )

          replace_once(
              'mobile/scripts/verify-v173-universal-instrument-integrity.js',
              "assert.ok(quoteContract.includes('evaluateMobileQuoteIntegrity'));",
              "assert.ok(quoteContract.includes('evaluateMobileQuoteIntegrity'));\nassert.ok(quoteContract.includes('advertisedDelayMinutes: Math.max(0, Number(entry.advertisedDelayMinutes ?? inherited?.advertisedDelayMinutes ?? 0))'));",
          )

          replace_once(
              'market-intelligence/gateway/src/core.js',
              "function usCompany(symbol) {\n  return {\n    companyId: `gateway:us:${symbol}`,\n    displayName: symbol,\n    country: 'US',\n    active: true,\n    primaryListing: { symbol },\n  };\n}",
              "const CANONICAL_US_COMPANIES = Object.freeze({\n  SPCE: Object.freeze({\n    companyId: 'company:virgin-galactic-holdings',\n    displayName: 'Virgin Galactic',\n    country: 'US',\n    currency: 'USD',\n    active: true,\n    primaryListing: Object.freeze({\n      exchange: 'New York Stock Exchange',\n      symbol: 'SPCE',\n      mic: 'XNYS',\n      currency: 'USD',\n    }),\n  }),\n});\n\nfunction usCompany(symbol) {\n  const canonical = CANONICAL_US_COMPANIES[symbol];\n  if (canonical) return canonical;\n  return {\n    companyId: `gateway:us:${symbol}`,\n    displayName: symbol,\n    country: 'US',\n    active: true,\n    primaryListing: { symbol },\n  };\n}",
          )

          replace_once(
              'market-intelligence/gateway/src/edge.js',
              "  if (String(resourceKey || '').endsWith('.US')) return 5;",
              "  if (String(resourceKey || '').endsWith('.US')) return 30;",
          )

          p = Path('market-intelligence/test/market-gateway.test.js')
          text = p.read_text()
          old = "  assert.equal(JSON.stringify(body).includes(secret), false);\n  assert.equal(calls.length, 2);"
          new = "  assert.equal(JSON.stringify(body).includes(secret), false);\n  assert.equal(calls.length, 1);\n  assert.match(calls[0].url, /finnhub\\.io\\/api\\/v1\\/quote\\?symbol=SPCE/);\n  assert.equal(calls.some((call) => call.url.includes('/stock/profile2')), false);"
          if text.count(old) != 1:
              raise SystemExit('market-gateway.test.js: expected SPCE call-count assertion once')
          p.write_text(text.replace(old, new, 1))

          p = Path('market-intelligence/test/market-gateway-edge.test.js')
          text = p.read_text()
          replacements = [
              ("assert.equal(gatewayCacheTtlSeconds('SPCE.US'), 5);", "assert.equal(gatewayCacheTtlSeconds('SPCE.US'), 30);"),
              ("test('cache miss applies both limiters, calls canonical core and stores only a five-second US edge copy'", "test('cache miss applies both limiters, calls canonical core and stores a thirty-second US edge copy'"),
              ("assert.equal(cache.puts[0].cacheControl, 'public, max-age=5');", "assert.equal(cache.puts[0].cacheControl, 'public, max-age=30');"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'market-gateway-edge.test.js: expected once: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Test market gateway and Finnhub contracts
        working-directory: market-intelligence
        run: |
          set -euo pipefail
          node --check gateway/src/core.js
          node --check gateway/src/edge.js
          node --test test/finnhub-quote.test.js test/market-gateway.test.js test/market-gateway-edge.test.js
          node scripts/verify-canonical-source.js

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Test canonical mobile core
        working-directory: mobile
        run: npm run test:core

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/src/quote-contract.js mobile/scripts/verify-v173-universal-instrument-integrity.js market-intelligence/gateway/src/core.js market-intelligence/gateway/src/edge.js market-intelligence/test/market-gateway.test.js market-intelligence/test/market-gateway-edge.test.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(market-data): close live device gateway regressions'
          git push origin HEAD:investor-control-core-stabilization-v174
