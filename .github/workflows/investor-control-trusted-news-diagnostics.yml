name: Investor Control Athens Fundamentals Diagnostics

on:
  push:
    branches: [main]
    paths: [.github/workflows/investor-control-trusted-news-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout intelligence source
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation
          path: source
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe Athens issuer financial and announcement HTML
        working-directory: source/market-intelligence
        run: |
          node --input-type=module - <<'NODE'
          import { extractAthensFinancialDocuments } from './src/adapters/euronext-athens-fundamentals.js';

          const targets = [
            {
              name:'CrediaBank',
              company:{ companyId:'company:crediabank', displayName:'CrediaBank', legalName:'CrediaBank S.A.', aliases:['CrediaBank A.T.E.','ATTICA BANK'], issuerId:'50' },
              urls:[
                'https://athens.euronext.com/en/market-data/issuers/50/financial-data',
                'https://athens.euronext.com/el/market-data/issuers/50/financial-data?page=0',
              ],
            },
            {
              name:'Allwyn',
              company:{ companyId:'company:allwyn-ag', displayName:'Allwyn', legalName:'Allwyn AG', aliases:['OPAP','OPAP SA','OPAP S.A.'], issuerId:'863' },
              urls:[
                'https://athens.euronext.com/en/market-data/issuers/863/financial-data',
                'https://athens.euronext.com/en/market-data/issuers/863/announcements',
              ],
            },
          ];
          const ua='Investor-Control-Market-Intelligence/1.0';
          for (const target of targets) {
            console.log(`\n===== ${target.name} =====`);
            for (const url of target.urls) {
              const response=await fetch(url,{headers:{Accept:'text/html,application/xhtml+xml','Cache-Control':'no-cache','User-Agent':ua}});
              const html=await response.text();
              console.log(JSON.stringify({url,status:response.status,finalUrl:response.url,contentType:response.headers.get('content-type'),length:html.length,trCount:(html.match(/<tr\b/gi)||[]).length,pdfCount:(html.match(/\.pdf/gi)||[]).length,downloadPdfCount:(html.match(/downloadpdf/gi)||[]).length}));
              if (url.includes('/financial-data')) {
                const docs=extractAthensFinancialDocuments(html,target.company);
                console.log('DOCS',JSON.stringify(docs.slice(0,10),null,2));
              }
              const needles=target.name==='CrediaBank' ? ['CrediaBank','ATTICA BANK','2026,Three','2026,Τριμην'] : ['Q1 2026','Preliminary Unaudited','Allwyn','OPAP SA'];
              for (const needle of needles) {
                const i=html.toLowerCase().indexOf(needle.toLowerCase());
                if(i>=0) console.log(`CONTEXT ${needle}`,html.slice(Math.max(0,i-1800),i+5000).replace(/\s+/g,' '));
              }
              const anchors=[...html.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)].map(m=>({href:m[1],text:m[2].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}));
              const relevant=anchors.filter(a=>/crediabank|attica|allwyn|opap|financial|q1|result|download|pdf/i.test(`${a.text} ${a.href}`)).slice(0,40);
              console.log('RELEVANT_ANCHORS',JSON.stringify(relevant,null,2));
            }
          }
          NODE
