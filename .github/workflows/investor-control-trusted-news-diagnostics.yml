name: Investor Control Trusted News Diagnostics

on:
  push:
    branches: [main]
    paths: [.github/workflows/investor-control-trusted-news-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout intelligence source
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation
          path: source
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose GDELT direct trusted publisher discovery
        working-directory: source/market-intelligence
        run: |
          node --input-type=module - <<'NODE'
          const targets = [
            { name:'Virgin Galactic', query:'"Virgin Galactic"' },
            { name:'Allwyn', query:'Allwyn' },
            { name:'CrediaBank', query:'CrediaBank' },
          ];
          const allow = /(?:^|\.)(reuters\.com|bloomberg\.com|ft\.com|wsj\.com|apnews\.com|cnbc\.com|marketwatch\.com|fortune\.com)$/i;
          for (const target of targets) {
            const params = new URLSearchParams({ query:target.query, mode:'ArtList', maxrecords:'75', format:'json', sort:'HybridRel' });
            const url = `https://api.gdeltproject.org/api/v2/doc/doc?${params}`;
            const response = await fetch(url, { headers:{ 'User-Agent':'Investor-Control-Market-Intelligence/1.0', Accept:'application/json' } });
            const body = await response.text();
            console.log(`\nTARGET ${target.name}`);
            console.log(JSON.stringify({ status:response.status, contentType:response.headers.get('content-type'), length:body.length, url }));
            let payload = null;
            try { payload = JSON.parse(body); } catch { console.log('BODY_PREFIX', body.slice(0,1200).replace(/\s+/g,' ')); continue; }
            const articles = Array.isArray(payload?.articles) ? payload.articles : [];
            console.log('ARTICLE_COUNT', articles.length);
            const trusted = [];
            for (const article of articles) {
              let host='';
              try { host = new URL(article.url).hostname.replace(/^www\./,'').toLowerCase(); } catch {}
              if (!allow.test(host)) continue;
              trusted.push({ title:article.title, url:article.url, domain:article.domain || host, host, seendate:article.seendate, language:article.language, sourcecountry:article.sourcecountry });
            }
            console.log('TRUSTED_DIRECT', JSON.stringify(trusted.slice(0,20), null, 2));
            for (const article of trusted.slice(0,5)) {
              try {
                const r = await fetch(article.url, { redirect:'follow', headers:{ 'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36', Accept:'text/html,*/*' } });
                const html=await r.text();
                console.log('ARTICLE_PROBE', JSON.stringify({ source:target.name, url:article.url, status:r.status, finalUrl:r.url, contentType:r.headers.get('content-type'), bodyLength:html.length, companyMention:html.toLowerCase().includes(target.name.toLowerCase()) }));
              } catch (error) {
                console.log('ARTICLE_ERROR', JSON.stringify({ source:target.name, url:article.url, message:String(error) }));
              }
            }
          }
          NODE
