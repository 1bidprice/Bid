name: Investor Control Trusted News Diagnostics

on:
  push:
    branches: [main]
    paths: [.github/workflows/investor-control-trusted-news-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout intelligence source
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation
          path: source
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose Bing News RSS direct publisher links
        working-directory: source/market-intelligence
        run: |
          node --input-type=module - <<'NODE'
          const query = encodeURIComponent('"Virgin Galactic" SPCE');
          const url = `https://www.bing.com/news/search?q=${query}&format=rss&mkt=en-US`;
          const response = await fetch(url, { headers:{ 'User-Agent':'Mozilla/5.0 Investor-Control/1.0', Accept:'application/rss+xml,application/xml,text/xml,*/*' } });
          const xml = await response.text();
          console.log(JSON.stringify({ status:response.status, url:response.url, contentType:response.headers.get('content-type'), length:xml.length }));
          console.log('XML_PREFIX', xml.slice(0,1500).replace(/\s+/g,' '));
          const blocks = xml.match(/<item\b[\s\S]*?<\/item>/gi) || [];
          console.log('ITEM_COUNT', blocks.length);
          const tag = (block,name) => (block.match(new RegExp(`<${name}(?:\\s[^>]*)?>([\\s\\S]*?)<\\/${name}>`,'i')) || [])[1] || null;
          const clean = (v) => String(v||'').replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
          for (const block of blocks.slice(0,20)) {
            const title = clean(tag(block,'title'));
            const link = clean(tag(block,'link'));
            const source = clean(tag(block,'News:Source') || tag(block,'source'));
            let direct = null;
            try {
              const parsed = new URL(link);
              direct = parsed.searchParams.get('url') || parsed.searchParams.get('u') || null;
              if (direct) direct = decodeURIComponent(direct);
            } catch {}
            console.log(JSON.stringify({ title, source, link, direct }));
            if (direct && /marketwatch\.com|reuters\.com|cnbc\.com|bloomberg\.com|wsj\.com|ft\.com|fortune\.com|apnews\.com/i.test(direct)) {
              try {
                const article = await fetch(direct, { redirect:'follow', headers:{ 'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36', Accept:'text/html,*/*' } });
                const body = await article.text();
                console.log('DIRECT_ARTICLE_PROBE', JSON.stringify({ direct, status:article.status, finalUrl:article.url, contentType:article.headers.get('content-type'), bodyLength:body.length, prefix:body.slice(0,180).replace(/\s+/g,' ') }));
              } catch (error) {
                console.log('DIRECT_ARTICLE_ERROR', JSON.stringify({ direct, message:String(error) }));
              }
            }
          }
          NODE
