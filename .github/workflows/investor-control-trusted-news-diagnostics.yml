name: Investor Control Trusted News Diagnostics

on:
  push:
    branches: [main]
    paths: [.github/workflows/investor-control-trusted-news-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout intelligence source
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation
          path: source
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose SPCE Google News publisher payload
        working-directory: source/market-intelligence
        run: |
          node --input-type=module - <<'NODE'
          import { fetchTrustedNewsEvidence } from './src/adapters/trusted-news-rss.js';

          const company = {
            companyId: 'company:virgin-galactic-holdings',
            legalName: 'Virgin Galactic Holdings, Inc.',
            displayName: 'Virgin Galactic',
            aliases: ['Virgin Galactic Holdings', 'Virgin Galactic'],
            primaryListing: { symbol: 'SPCE', mic: 'XNYS', exchange: 'New York Stock Exchange' },
          };
          const discovery = await fetchTrustedNewsEvidence(company, { review: false, limit: 30, retrievedAt: new Date().toISOString() });
          const browserUa = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36';

          console.log('ACCEPTED_RECORDS');
          for (const record of discovery.records || []) console.log(JSON.stringify({ id:record.id, sourceName:record.sourceName, sourceUrl:record.sourceUrl, title:record.title, publishedAt:record.publishedAt }));

          for (const record of (discovery.records || []).slice(0, 5)) {
            console.log(`\nPROBE ${record.id} ${record.sourceName}`);
            const response = await fetch(record.sourceUrl, { redirect:'follow', headers:{ 'User-Agent':browserUa, Accept:'text/html,*/*', 'Accept-Language':'en-US,en;q=0.9' } });
            const body = await response.text();
            const lower = body.toLowerCase();
            const publisherNeedle = String(record.sourceName || '').toLowerCase().replace(/[^a-z0-9]/g,'');
            const rawIndex = lower.indexOf(String(record.sourceName || '').toLowerCase());
            console.log(JSON.stringify({ status:response.status, url:response.url, contentType:response.headers.get('content-type'), bodyLength:body.length, sourceNameIndex:rawIndex }));
            if (rawIndex >= 0) console.log('SOURCE_CONTEXT', body.slice(Math.max(0,rawIndex-1200), rawIndex+3000).replace(/\s+/g,' '));

            const urlish = [...body.matchAll(/https?:\\?[/]\\?[/][^\s"'<>\\]{1,700}/gi)].map((m)=>m[0]);
            const sourceMatches = urlish.filter((u)=>u.toLowerCase().replace(/[^a-z0-9]/g,'').includes(publisherNeedle)).slice(0,20);
            console.log('URLISH_SOURCE_MATCHES', JSON.stringify(sourceMatches, null, 2));

            const marketIndex = lower.indexOf('marketwatch');
            if (marketIndex >= 0) console.log('MARKETWATCH_CONTEXT', body.slice(Math.max(0,marketIndex-1500), marketIndex+5000).replace(/\s+/g,' '));
            const escapedDecoded = body.replace(/\\u002F/gi,'/').replace(/\\u003A/gi,':').replace(/\\\//g,'/');
            const decodedIndex = escapedDecoded.toLowerCase().indexOf('marketwatch');
            if (decodedIndex >= 0) console.log('DECODED_MARKETWATCH_CONTEXT', escapedDecoded.slice(Math.max(0,decodedIndex-1500),decodedIndex+5000).replace(/\s+/g,' '));
            const direct = [...escapedDecoded.matchAll(/https?:\/\/[^\s"'<>]{1,900}/gi)].map((m)=>m[0]).filter((u)=>/marketwatch\.com/i.test(u)).slice(0,20);
            console.log('DIRECT_MARKETWATCH_URLS', JSON.stringify(direct, null, 2));
          }
          NODE
