name: Signed Investor Control v1.7.3 Canonical Core APK

on:
  push:
    branches:
      - investor-control-core-stabilization-v174
      - investor-control-v1.1-unified-intelligence
    paths:
      - mobile/**
      - .github/workflows/build-investor-control-v0.7.1-live-sync.yml
  pull_request:
    branches:
      - investor-control-v1-market-intelligence-foundation
    paths:
      - mobile/**
      - .github/workflows/build-investor-control-v0.7.1-live-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-control-canonical-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install canonical dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify canonical core before native build
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npm run test:core
          npx expo install --check
          npx expo-doctor@latest
          npx expo export --platform android --output-dir dist-v1.7.3-canonical
          node - <<'NODE'
          const fs = require('fs');
          const app = require('./app.json');
          const pkg = require('./package.json');
          const portfolio = fs.readFileSync('./PortfolioApp.js', 'utf8');
          const market = fs.readFileSync('./src/market-data.js', 'utf8');
          const marketRules = fs.readFileSync('./src/market-rules.js', 'utf8');
          const accounting = fs.readFileSync('./src/transaction-accounting.js', 'utf8');
          if (app.expo.version !== '1.7.3') throw new Error('wrong Expo version');
          if (app.expo.android.versionCode !== 31) throw new Error('wrong versionCode');
          if (app.expo.android.package !== 'gr.investorcontrol.app') throw new Error('wrong package');
          if (pkg.version !== '1.7.3') throw new Error('wrong package version');
          if (String(pkg.scripts?.postinstall || '').includes('apply-v')) throw new Error('legacy patch chain returned');
          if (!portfolio.includes("import { buildPortfolioSnapshot } from './src/portfolio-engine';")) throw new Error('canonical portfolio engine missing');
          if (!accounting.includes('accountingInvariantReport')) throw new Error('canonical accounting invariant engine missing');
          if (!market.includes("if (route.market === 'GR')")) throw new Error('generic Athens routing missing');
          if (!marketRules.includes('regularStart: 10 * 60 + 15') || !marketRules.includes('regularEnd: 17 * 60 + 20')) throw new Error('Athens session rules missing');
          if (!marketRules.includes('ATHENS_MARKET_HOLIDAYS')) throw new Error('Athens market calendar missing');
          console.log('PASS canonical v1.7.3 accounting, portfolio and Euronext Athens release gates');
          NODE

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-v1.7.3-canonical.log

      - name: Upload Gradle failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v1.7.3-canonical-gradle-diagnostic
          path: mobile/gradle-v1.7.3-canonical.log
          if-no-files-found: warn
          retention-days: 30

      - name: Sign and verify update APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='mobile/android/app/build/outputs/apk/release/app-release.apk'
          KEYSTORE='mobile/android/app/debug.keystore'
          OUTPUT='mobile/Investor-Control-v1.7.3-canonical.apk'
          ALIGNED='mobile/Investor-Control-v1.7.3-canonical-aligned.apk'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -s "$UNSIGNED"
          test -s "$KEYSTORE"
          unzip -l "$UNSIGNED" | grep -q 'assets/index.android.bundle'
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee mobile/Investor-Control-v1.7.3-canonical-signature.txt
          grep -qi 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' mobile/Investor-Control-v1.7.3-canonical-signature.txt
          unzip -l "$OUTPUT" | grep -q 'assets/index.android.bundle'
          sha256sum "$OUTPUT" | tee mobile/Investor-Control-v1.7.3-canonical.sha256

      - name: Upload signed canonical APK
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v1.7.3-canonical-core-signed-apk
          path: |
            mobile/Investor-Control-v1.7.3-canonical.apk
            mobile/Investor-Control-v1.7.3-canonical.sha256
            mobile/Investor-Control-v1.7.3-canonical-signature.txt
          if-no-files-found: error
          retention-days: 90
