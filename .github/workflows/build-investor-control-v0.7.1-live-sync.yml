name: Signed Investor Control v0.8.1 Position Performance APK

on:
  push:
    branches:
      - investor-control-v1-market-intelligence-foundation
    paths:
      - mobile/**
      - .github/workflows/build-investor-control-v0.7.1-live-sync.yml
  pull_request:
    branches:
      - investor-control-v0.6.5-native-ui-fix
    paths:
      - mobile/**
      - .github/workflows/build-investor-control-v0.7.1-live-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-control-v081-lot-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout v0.8.1 source
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies without lifecycle scripts
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Apply v0.6.5 native baseline patch
        working-directory: mobile
        run: node scripts/apply-v065-native-ui-fix.js

      - name: Apply v0.7.0 Opportunities patch
        working-directory: mobile
        run: node scripts/apply-v070-opportunities.js

      - name: Apply v0.7.1 live-sync patch
        working-directory: mobile
        run: node scripts/apply-v071-live-sync.js

      - name: Apply v0.8.0 autonomous decisions patch
        working-directory: mobile
        run: node scripts/apply-v080-autonomous-decisions.js

      - name: Apply v0.8.1 position-performance patch
        working-directory: mobile
        run: node scripts/apply-v081-position-performance.js

      - name: Verify purchase-lot calculations
        working-directory: mobile
        run: npm run test:lots

      - name: Verify v0.8.1 source invariants
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const VERSION = '0.8.1';" PortfolioApp.js
          grep -q "const VERSION = '0.8.1';" DecisionOverlay.js
          grep -q "require('./src/position-lots')" PortfolioApp.js
          grep -q "Από θέση" PortfolioApp.js
          grep -q "Επιμέρους αγορές" PortfolioApp.js
          grep -q "Κάθε αγορά κρατά το δικό της all-in και πρόσημο" PortfolioApp.js
          grep -q "lotSummary.openLots" PortfolioApp.js
          grep -q "FIFO" src/position-lots.js
          grep -q "decisionVisible" App.js
          grep -q "onOpenDecisionGate" PortfolioApp.js
          grep -q "styles.decisionEntry" PortfolioApp.js
          grep -q "DEFAULT_INTELLIGENCE_FEED_URL" src/intelligence-feed-store.js
          grep -q "ΤΕΛΙΚΟ ΣΥΜΠΕΡΑΣΜΑ ΓΙΑ ΕΣΕΝΑ" src/FinalDecisionCard.js
          node - <<'NODE'
          const app = require('./app.json');
          const pkg = require('./package.json');
          if (app.expo.version !== '0.8.1') throw new Error('wrong Expo version');
          if (app.expo.android.package !== 'gr.investorcontrol.app') throw new Error('wrong package');
          if (app.expo.android.versionCode !== 17) throw new Error('wrong versionCode');
          if (pkg.version !== '0.8.1') throw new Error('wrong package version');
          if (!pkg.scripts.postinstall.includes('apply-v081-position-performance.js')) throw new Error('v0.8.1 patch missing from postinstall');
          console.log('PASS v0.8.1 daily change, aggregate position performance and separate purchase lots');
          NODE

      - name: Expo Doctor diagnostic
        continue-on-error: true
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-v0.8.1.log

      - name: Upload Gradle failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v0.8.1-gradle-diagnostic
          path: mobile/gradle-v0.8.1.log
          if-no-files-found: warn
          retention-days: 30

      - name: Sign and verify update APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='mobile/android/app/build/outputs/apk/release/app-release.apk'
          KEYSTORE='mobile/android/app/debug.keystore'
          OUTPUT='mobile/Investor-Control-v0.8.1.apk'
          ALIGNED='mobile/Investor-Control-v0.8.1-aligned.apk'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -s "$UNSIGNED"
          test -s "$KEYSTORE"
          unzip -l "$UNSIGNED" | grep -q 'assets/index.android.bundle'
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee mobile/Investor-Control-v0.8.1-signature.txt
          grep -qi 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' mobile/Investor-Control-v0.8.1-signature.txt
          unzip -l "$OUTPUT" | grep -q 'assets/index.android.bundle'
          sha256sum "$OUTPUT" | tee mobile/Investor-Control-v0.8.1.sha256

      - name: Upload signed v0.8.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v0.8.1-position-performance-signed-apk
          path: |
            mobile/Investor-Control-v0.8.1.apk
            mobile/Investor-Control-v0.8.1.sha256
            mobile/Investor-Control-v0.8.1-signature.txt
          if-no-files-found: error
          retention-days: 90
