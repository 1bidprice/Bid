name: Signed Investor Control v0.9.0 Discovery Radar APK

on:
  push:
    branches:
      - investor-control-v1-market-intelligence-foundation
    paths:
      - mobile/**
      - .github/workflows/build-investor-control-v0.7.1-live-sync.yml
  pull_request:
    branches:
      - investor-control-v0.6.5-native-ui-fix
    paths:
      - mobile/**
      - .github/workflows/build-investor-control-v0.7.1-live-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-control-v090-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout v0.9.0 source
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies without lifecycle scripts
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Apply complete native patch chain
        working-directory: mobile
        run: |
          node scripts/apply-v065-native-ui-fix.js
          node scripts/apply-v070-opportunities.js
          node scripts/apply-v071-live-sync.js
          node scripts/apply-v080-autonomous-decisions.js
          node scripts/apply-v081-position-performance.js
          node scripts/apply-v081b-fix-source-newline.js
          node scripts/apply-v090-discovery-clarity.js

      - name: Verify purchase-lot calculations
        working-directory: mobile
        run: npm run test:lots

      - name: Verify v0.9.0 source invariants
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const VERSION = '0.9.0';" PortfolioApp.js
          grep -q "const VERSION = '0.9.0';" DecisionOverlay.js
          grep -q "require('./src/position-lots')" PortfolioApp.js
          grep -q "Από αγορά ·" PortfolioApp.js
          grep -q "lot.purchaseNumber + 'η αγορά · '" PortfolioApp.js
          grep -q "Επιμέρους αγορές" PortfolioApp.js
          grep -q "performanceStack: { width: '100%'" PortfolioApp.js
          grep -q "Διαφάνεια τιμής" PortfolioApp.js
          grep -q "Μέση τιμή all-in" PortfolioApp.js
          grep -q "ΝΕΑ ΑΓΟΡΑ: ΟΧΙ" DecisionOverlay.js
          grep -q "Υπάρχουσα θέση" DecisionOverlay.js
          grep -q "Ραντάρ νέων μετοχών" src/OpportunitiesView.js
          grep -q "Ποιος επιλέγει τις πηγές" src/OpportunitiesView.js
          grep -q "SUPPORTED_FEED_VERSIONS" src/intelligence-feed-store.js
          grep -q "discoveryRadar" src/intelligence-feed-store.js
          grep -q "decisionVisible" App.js
          grep -q "onOpenDecisionGate" PortfolioApp.js
          grep -q "DEFAULT_INTELLIGENCE_FEED_URL" src/intelligence-feed-store.js
          grep -q "ΤΕΛΙΚΟ ΣΥΜΠΕΡΑΣΜΑ ΓΙΑ ΕΣΕΝΑ" src/FinalDecisionCard.js
          node - <<'NODE'
          const fs = require('fs');
          const app = require('./app.json');
          const pkg = require('./package.json');
          const portfolio = fs.readFileSync('./PortfolioApp.js', 'utf8');
          const store = fs.readFileSync('./src/intelligence-feed-store.js', 'utf8');
          if (app.expo.version !== '0.9.0') throw new Error('wrong Expo version');
          if (app.expo.android.package !== 'gr.investorcontrol.app') throw new Error('wrong package');
          if (app.expo.android.versionCode !== 18) throw new Error('wrong versionCode');
          if (pkg.version !== '0.9.0') throw new Error('wrong package version');
          if (!pkg.scripts.postinstall.includes('apply-v090-discovery-clarity.js')) throw new Error('v0.9.0 patch missing from postinstall');
          if (!portfolio.includes("quotePrice(item.average, item.currency, 4)")) throw new Error('four-decimal average all-in missing');
          if (!store.includes('new Set([1, 2])')) throw new Error('feed backward compatibility missing');
          console.log('PASS v0.9.0 clarity, source policy and autonomous discovery radar invariants');
          NODE

      - name: Verify Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-v0.9.0

      - name: Expo Doctor diagnostic
        continue-on-error: true
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-v0.9.0.log

      - name: Upload Gradle failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v0.9.0-gradle-diagnostic
          path: mobile/gradle-v0.9.0.log
          if-no-files-found: warn
          retention-days: 30

      - name: Sign and verify update APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='mobile/android/app/build/outputs/apk/release/app-release.apk'
          KEYSTORE='mobile/android/app/debug.keystore'
          OUTPUT='mobile/Investor-Control-v0.9.0.apk'
          ALIGNED='mobile/Investor-Control-v0.9.0-aligned.apk'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -s "$UNSIGNED"
          test -s "$KEYSTORE"
          unzip -l "$UNSIGNED" | grep -q 'assets/index.android.bundle'
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee mobile/Investor-Control-v0.9.0-signature.txt
          grep -qi 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' mobile/Investor-Control-v0.9.0-signature.txt
          unzip -l "$OUTPUT" | grep -q 'assets/index.android.bundle'
          sha256sum "$OUTPUT" | tee mobile/Investor-Control-v0.9.0.sha256

      - name: Upload signed v0.9.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v0.9.0-discovery-radar-signed-apk
          path: |
            mobile/Investor-Control-v0.9.0.apk
            mobile/Investor-Control-v0.9.0.sha256
            mobile/Investor-Control-v0.9.0-signature.txt
          if-no-files-found: error
          retention-days: 90
