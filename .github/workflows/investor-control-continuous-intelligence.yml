name: Investor Control Production Intelligence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/investor-control-continuous-intelligence.yml
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * 1-5'
    - cron: '37 */6 * * 0,6'

permissions:
  contents: write

concurrency:
  group: investor-control-production-intelligence
  cancel-in-progress: false

jobs:
  autonomous-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout production intelligence source
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation
          path: source
          fetch-depth: 1

      - name: Checkout live feed channel
        uses: actions/checkout@v4
        with:
          ref: investor-control-live-feed
          path: live-feed
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure controlled PDF extraction runtime
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdftotext -v

      - name: Run deterministic tests on explicit deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: source/market-intelligence
        run: npm test

      - name: Build autonomous evidence, market data and decisions
        working-directory: source/market-intelligence
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          npm run run:autonomous
          npm run build:autonomous-mobile

      - name: Verify production contracts and execution boundary
        working-directory: source/market-intelligence
        run: |
          node - <<'NODE'
          const report = require('./out/autonomous-intelligence.json');
          const feed = require('./out/mobile-intelligence-feed.json');
          const allowed = new Set(['BUY_NOW', 'SELL_NOW', 'HOLD', 'DO_NOT_BUY', 'AVOID', 'WATCH']);
          if (report.format !== 'investor-control-daily-intelligence' || report.version !== 7) throw new Error('wrong autonomous report contract');
          if (!report.policyVersion || !report.finalActionCounts || !report.discovery || !report.operationalHealth) throw new Error('production metadata missing');
          if (report.discovery.sourcePolicy?.runtimeAiSourceSelection !== false) throw new Error('runtime AI source selection boundary broken');
          if (feed.format !== 'investor-control-mobile-intelligence-feed' || feed.version !== 2) throw new Error('wrong mobile feed contract');
          if (!Array.isArray(feed.decisions) || !Array.isArray(feed.discoveryRadar)) throw new Error('decision or discovery list missing');
          const generatedAt = new Date(report.generatedAt).getTime();
          if (!Number.isFinite(generatedAt) || Math.abs(Date.now() - generatedAt) > 60 * 60 * 1000) throw new Error('production output is not fresh');
          for (const candidate of feed.discoveryRadar) {
            if (candidate.suggestedAction !== 'WATCH') throw new Error('discovery candidate leaked a directional action');
          }
          for (const dossier of report.researchDossiers) {
            const finalAction = dossier.finalAction;
            if (!finalAction || !allowed.has(finalAction.marketAction)) throw new Error('invalid final action');
            if (finalAction.execution?.automaticBrokerOrder !== false || finalAction.execution?.requiresUserExecution !== true) throw new Error('broker execution boundary broken');
            if (finalAction.status === 'BLOCKED' && finalAction.marketAction !== 'WATCH') throw new Error('blocked dossier leaked a direction');
            if (dossier.publicationMode === 'AUTOMATED_POLICY' && (dossier.status !== 'PUBLISHED' || finalAction.status !== 'FINAL' || finalAction.marketAction === 'WATCH')) throw new Error('invalid automated publication');
          }
          for (const item of feed.research) if (item.action !== 'WATCH') throw new Error('draft research leaked directional action');
          console.log(`PASS health=${feed.operationalHealth?.status}, market=${report.marketSnapshotCount}, history=${report.historicalMarketMetricsCount}, readyHistory=${feed.sourceHealth?.readyHistoricalMarketMetricsCount}, final=${feed.summary.finalActionCount}, blocked=${feed.summary.blockedDecisionCount}`);
          NODE

      - name: Publish verified live channel and audit history
        shell: bash
        run: |
          set -euo pipefail
          cp source/market-intelligence/out/mobile-intelligence-feed.json live-feed/mobile-intelligence-feed.json
          cp source/market-intelligence/out/autonomous-intelligence.json live-feed/autonomous-intelligence.json
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');
          const feedPath = './live-feed/mobile-intelligence-feed.json';
          const reportPath = './live-feed/autonomous-intelligence.json';
          const feed = JSON.parse(fs.readFileSync(feedPath, 'utf8'));
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const feedSha256 = crypto.createHash('sha256').update(fs.readFileSync(feedPath)).digest('hex');
          const now = new Date().toISOString();
          const sourceCommit = execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const readyHistory = (report.historicalMarketMetrics || []).filter((item) => item?.readiness?.marketMetricsReady === true).length;
          const operationalStatus = readyHistory > 0 && Number(report.marketSnapshotCount || 0) > 0 ? 'OPERATIONAL' : 'DEGRADED';
          const status = {
            format: 'investor-control-live-feed-status',
            version: 5,
            generatedAt: feed.generatedAt,
            publishedAt: now,
            policyVersion: feed.policyVersion,
            sourcePolicyVersion: feed.sourceSelection?.version || null,
            sourceWorkflowRunId: process.env.GITHUB_RUN_ID,
            sourceCommit,
            feedSha256,
            operationalHealth: {
              ...(report.operationalHealth || {}),
              status: operationalStatus,
              readyHistoricalMarketMetricsCount: readyHistory,
              lastSuccessfulPublicationAt: now,
              staleOutput: false,
            },
            counts: feed.summary,
            sourceHealth: {
              evidenceCount: report.evidenceCount,
              documentReviewedCount: report.documentReviewedCount,
              independentDiscoveryCount: report.independentDiscoveryCount,
              fundamentalSnapshotCount: report.fundamentalSnapshotCount,
              marketSnapshotCount: report.marketSnapshotCount,
              historicalMarketMetricsCount: report.historicalMarketMetricsCount,
              readyHistoricalMarketMetricsCount: readyHistory,
              registryCompanyCount: report.discovery?.registryCompanyCount || 0,
              filingEventCount: report.discovery?.filingEventCount || 0,
              discoveryCandidateCount: report.discovery?.candidateCount || 0,
              discoveryDeepAnalysisCount: report.discovery?.deepAnalysisCompanyCount || 0,
              diagnosticCount: (report.diagnostics?.length || 0) + (report.discovery?.diagnostics?.length || 0),
            },
          };
          fs.writeFileSync('./live-feed/status.json', `${JSON.stringify(status, null, 2)}\n`);

          let history = [];
          try {
            const parsed = JSON.parse(fs.readFileSync('./live-feed/decision-history.json', 'utf8'));
            history = Array.isArray(parsed.items) ? parsed.items : [];
          } catch {}
          const current = (feed.decisions || []).map((item) => ({
            recordedAt: now,
            feedGeneratedAt: feed.generatedAt,
            policyVersion: feed.policyVersion,
            dossierId: item.id,
            companyId: item.companyId,
            companyName: item.companyName,
            symbol: item.symbol,
            origin: item.origin,
            marketAction: item.finalAction?.marketAction,
            holderAction: item.finalAction?.holderAction,
            nonHolderAction: item.finalAction?.nonHolderAction,
            urgency: item.finalAction?.urgency,
            confidenceScore: item.finalAction?.confidenceScore,
            dataQualityScore: item.finalAction?.dataQualityScore,
            referencePrice: item.referencePrice,
            validUntil: item.finalAction?.validUntil,
          }));
          const identity = (item) => `${item.dossierId}|${item.marketAction}|${item.referencePrice?.timestamp || ''}`;
          const seen = new Set(current.map(identity));
          const merged = [...current, ...history.filter((item) => !seen.has(identity(item)))].slice(0, 500);
          fs.writeFileSync('./live-feed/decision-history.json', `${JSON.stringify({ format: 'investor-control-decision-history', version: 1, updatedAt: now, items: merged }, null, 2)}\n`);
          fs.writeFileSync('./live-feed/discovery-radar.json', `${JSON.stringify({ format: 'investor-control-discovery-radar', version: 1, updatedAt: now, sourcePolicy: feed.sourceSelection, items: feed.discoveryRadar }, null, 2)}\n`);
          NODE
          cd live-feed
          git config user.name 'Investor Control Intelligence'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile-intelligence-feed.json autonomous-intelligence.json status.json decision-history.json discovery-radar.json
          if git diff --cached --quiet; then
            echo 'Live intelligence channel already current'
          else
            git commit -m "chore(feed): production intelligence ${GITHUB_RUN_ID} [skip ci]"
            git pull --rebase origin investor-control-live-feed
            git push origin HEAD:investor-control-live-feed
          fi

      - name: Publish failure heartbeat
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -d live-feed/.git || exit 0
          node - <<'NODE'
          const fs = require('fs');
          let status = { format: 'investor-control-live-feed-status', version: 5 };
          try { status = JSON.parse(fs.readFileSync('./live-feed/status.json', 'utf8')); } catch {}
          const now = new Date().toISOString();
          status.publishedAt = now;
          status.lastFailureAt = now;
          status.lastFailureWorkflowRunId = process.env.GITHUB_RUN_ID;
          status.operationalHealth = {
            ...(status.operationalHealth || {}),
            status: 'FAILED',
            staleOutput: true,
            lastFailureAt: now,
          };
          fs.writeFileSync('./live-feed/status.json', `${JSON.stringify(status, null, 2)}\n`);
          NODE
          cd live-feed
          git config user.name 'Investor Control Intelligence'
          git config user.email 'actions@users.noreply.github.com'
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): record production failure ${GITHUB_RUN_ID} [skip ci]"
            git pull --rebase origin investor-control-live-feed
            git push origin HEAD:investor-control-live-feed
          fi

      - name: Upload production evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-production-intelligence-${{ github.run_id }}
          path: |
            source/market-intelligence/out/autonomous-intelligence.json
            source/market-intelligence/out/mobile-intelligence-feed.json
            live-feed/status.json
          if-no-files-found: warn
          retention-days: 30
