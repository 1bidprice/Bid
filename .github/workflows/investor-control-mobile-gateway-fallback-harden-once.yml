name: Investor Control Mobile Gateway Fallback Harden Once

on:
  push:
    branches:
      - investor-control-core-stabilization-v174
    paths:
      - .github/scripts/harden-mobile-gateway-fallback.py
      - .github/workflows/investor-control-mobile-gateway-fallback-harden-once.yml

permissions:
  contents: write

concurrency:
  group: investor-control-mobile-gateway-fallback-harden-once
  cancel-in-progress: false

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact owner-authored source
        uses: actions/checkout@v4
        with:
          ref: investor-control-core-stabilization-v174
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply gateway fallback integrity hardening
        run: python3 .github/scripts/harden-mobile-gateway-fallback.py

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify full mobile canonical core
        working-directory: mobile
        run: npm run test:core

      - name: Verify Android Metro export with gateway mode enabled
        working-directory: mobile
        env:
          EXPO_PUBLIC_MARKET_GATEWAY_URL: https://gateway.invalid.example
        run: |
          set -euo pipefail
          rm -rf /tmp/investor-control-gateway-fallback-export
          npx expo export --platform android --output-dir /tmp/investor-control-gateway-fallback-export
          test -d /tmp/investor-control-gateway-fallback-export

      - name: Commit verified hardening and remove one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/harden-mobile-gateway-fallback.py
          git rm .github/workflows/investor-control-mobile-gateway-fallback-harden-once.yml
          git add mobile/src/market-data.js mobile/scripts/verify-market-gateway-runtime-integration.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mobile): fail closed on legacy quotes in gateway mode'
          git push origin HEAD:investor-control-core-stabilization-v174
