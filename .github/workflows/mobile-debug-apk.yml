name: Build Investor Control Standalone APK

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-debug-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_MARKET_GATEWAY_URL: ${{ vars.EXPO_PUBLIC_MARKET_GATEWAY_URL || 'https://investor-control-market-gateway.bidprice-alerts.workers.dev' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production market gateway build contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_PUBLIC_MARKET_GATEWAY_URL:-}" || { echo 'Missing repository variable EXPO_PUBLIC_MARKET_GATEWAY_URL. Release APK would disable the production gateway.' >&2; exit 1; }
          node -e "const u=new URL(process.env.EXPO_PUBLIC_MARKET_GATEWAY_URL); if(u.protocol!=='https:') process.exit(2); console.log('Gateway build contract: HTTPS URL configured');"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "${EXPO_PUBLIC_MARKET_GATEWAY_URL}/health" > gateway-health.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('gateway-health.json','utf8'));if(p.status!=='ok'||p.providers?.us!=='configured'||p.providers?.athens!=='official_delayed_15m'||p.providers?.fx!=='ecb_official_daily_reference'||p.providers?.researchQueue!=='configured') process.exit(3);console.log('Gateway live health contract verified');"
          rm -f gateway-health.json

      - name: Verify v1.7 mobile release identity
        run: npm run test:release-identity

      - name: Verify Product Recovery privacy data and history
        run: npm run test:local-data-ownership && npm run test:portfolio-history && npm run test:portfolio-data-flow && npm run test:portfolio-insights

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Verify embedded JavaScript bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -Eq 'index\.android\.bundle|assets/.*\.bundle' apk-contents.txt

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-standalone-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
