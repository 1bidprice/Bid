name: Investor Control Cancel Extra Production Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/investor-control-cancel-extra-production-once.yml

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel redundant production run and record proof
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_RUN_ID: '32174637124'
        run: |
          set -euo pipefail
          gh run cancel "$TARGET_RUN_ID" --repo "$GH_REPO" || true
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "format": "investor-control-production-cancel-proof",\n  "version": 1,\n  "generatedAt": "%s",\n  "cancelledRunId": "%s",\n  "reason": "REDUNDANT_AFTER_VERIFIED_SCHEDULED_PUBLICATION",\n  "cancelRequested": true\n}\n' "$GENERATED_AT" "$TARGET_RUN_ID" > /tmp/cancel-proof.json
          CONTENT="$(base64 -w0 /tmp/cancel-proof.json)"
          API_PATH="repos/$GH_REPO/contents/ops/investor-control-production-cancel-proof.json"
          EXISTING_SHA="$(gh api "$API_PATH?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" -f message='ops: update redundant production cancellation proof' -f content="$CONTENT" -f sha="$EXISTING_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT "$API_PATH" -f message='ops: record redundant production cancellation proof' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
