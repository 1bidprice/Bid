name: Investor Control Play Store Release Candidate

on:
  push:
    branches:
      - investor-control-play-store-release
      - investor-control-v173-release-pipeline-fix
    paths:
      - mobile/**
      - play-store/**
      - .github/workflows/build-investor-control-play-store-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-control-play-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout canonical release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies without lifecycle scripts
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Verify canonical core and release identity
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npm run test:core
          node - <<'NODE'
          const fs = require('fs');
          const app = require('./app.json');
          const pkg = require('./package.json');
          const portfolio = fs.readFileSync('./PortfolioApp.js', 'utf8');
          const decision = fs.readFileSync('./DecisionOverlay.js', 'utf8');
          if (app.expo.version !== '1.7.3') throw new Error('wrong app version');
          if (app.expo.android.versionCode !== 31) throw new Error('wrong versionCode');
          if (app.expo.android.package !== 'gr.investorcontrol.app') throw new Error('wrong package');
          if (pkg.version !== '1.7.3') throw new Error('wrong package version');
          if (pkg.scripts?.postinstall && String(pkg.scripts.postinstall).includes('apply-v')) throw new Error('historical patch chain must not run in production');
          if (!portfolio.includes("const VERSION = '1.7.3';") || !decision.includes("const VERSION = '1.7.3';")) throw new Error('runtime version mismatch');
          const buildPlugin = app.expo.plugins.find((item) => Array.isArray(item) && item[0] === 'expo-build-properties');
          if (!buildPlugin || buildPlugin[1]?.android?.targetSdkVersion !== 36 || buildPlugin[1]?.android?.compileSdkVersion !== 36) throw new Error('API 36 build properties missing');
          for (const permission of ['android.permission.CAMERA','android.permission.RECORD_AUDIO','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.READ_CONTACTS','android.permission.READ_SMS']) {
            if (!app.expo.android.blockedPermissions.includes(permission)) throw new Error(`sensitive permission not blocked: ${permission}`);
          }
          console.log('PASS canonical v1.7.3 Play release identity and privacy invariants');
          NODE

      - name: Expo compatibility and JavaScript bundle
        working-directory: mobile
        run: |
          set -euo pipefail
          npx expo install --check
          npx expo-doctor@latest
          npx expo export --platform android --output-dir dist-play-release

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK and Android App Bundle
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-play-release.log

      - name: Validate canonical release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/release/app-release.apk'
          AAB='mobile/android/app/build/outputs/bundle/release/app-release.aab'
          PLAY_AAB='mobile/Investor-Control-v1.7.3-build31-play-candidate.aab'
          AAPT2="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/aapt2"

          test -s "$APK"
          test -s "$AAB"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'

          "$AAPT2" dump badging "$APK" | tee mobile/Investor-Control-v1.7.3-build31-badging.txt
          grep -q "package: name='gr.investorcontrol.app' versionCode='31' versionName='1.7.3'" mobile/Investor-Control-v1.7.3-build31-badging.txt
          grep -q "targetSdkVersion:'36'" mobile/Investor-Control-v1.7.3-build31-badging.txt

          "$AAPT2" dump permissions "$APK" | tee mobile/Investor-Control-v1.7.3-build31-permissions.txt
          for forbidden in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CAMERA RECORD_AUDIO READ_CONTACTS WRITE_CONTACTS READ_PHONE_STATE CALL_PHONE READ_SMS SEND_SMS; do
            if grep -q "android.permission.${forbidden}" mobile/Investor-Control-v1.7.3-build31-permissions.txt; then
              echo "Forbidden permission present: ${forbidden}" >&2
              exit 1
            fi
          done

          cp "$AAB" "$PLAY_AAB"
          curl --fail --location --silent --show-error \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' \
            --output /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar validate --bundle="$PLAY_AAB"

          sha256sum "$PLAY_AAB" | tee mobile/Investor-Control-v1.7.3-build31-play-candidate.sha256

      - name: Upload Gradle diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v1.7.3-build31-release-diagnostic
          path: mobile/gradle-play-release.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload validated Play release candidate
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v1.7.3-build31-play-release-candidate
          path: |
            mobile/Investor-Control-v1.7.3-build31-play-candidate.aab
            mobile/Investor-Control-v1.7.3-build31-play-candidate.sha256
            mobile/Investor-Control-v1.7.3-build31-badging.txt
            mobile/Investor-Control-v1.7.3-build31-permissions.txt
            play-store/**
          if-no-files-found: error
          retention-days: 90
