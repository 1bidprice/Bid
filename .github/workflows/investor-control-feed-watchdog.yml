name: Investor Control Feed Watchdog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/investor-control-feed-watchdog.yml
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: investor-control-feed-watchdog
  cancel-in-progress: true

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live feed age and decide recovery
        id: health
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          event_name = os.environ.get('EVENT_NAME', '')
          force = event_name in {'push', 'workflow_dispatch'}
          url = 'https://raw.githubusercontent.com/1bidprice/Bid/investor-control-live-feed/status.json'
          reason = 'healthy'
          age_minutes = 10**9
          try:
              request = urllib.request.Request(url, headers={'User-Agent': 'Investor-Control-Watchdog/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = json.load(response)
              generated = datetime.fromisoformat(str(status.get('generatedAt', '')).replace('Z', '+00:00'))
              age_minutes = max(0, (datetime.now(timezone.utc) - generated).total_seconds() / 60)
              if status.get('format') != 'investor-control-live-feed-status':
                  reason = 'invalid_status_contract'
              elif age_minutes > 55:
                  reason = 'feed_older_than_55_minutes'
              elif status.get('operationalHealth', {}).get('staleOutput') is True:
                  reason = 'backend_marked_output_stale'
          except Exception as exc:
              reason = f'status_unavailable:{type(exc).__name__}'

          recover = force or reason != 'healthy'
          print(f'recover={str(recover).lower()}')
          print(f'reason={reason}')
          print(f'age_minutes={age_minutes:.1f}')
          PY

      - name: Dispatch production intelligence recovery
        if: steps.health.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Recovery reason: ${{ steps.health.outputs.reason }} · age ${{ steps.health.outputs.age_minutes }} minutes"
          gh workflow run investor-control-continuous-intelligence.yml --repo 1bidprice/Bid --ref main

      - name: Report healthy feed
        if: steps.health.outputs.recover != 'true'
        run: echo "Feed healthy · age ${{ steps.health.outputs.age_minutes }} minutes"
