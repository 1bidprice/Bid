name: Investor Control Health UX Integrate Once

on:
  push:
    branches: [investor-control-core-stabilization-v174]
    paths:
      - .github/workflows/investor-control-health-ux-integrate-once.yml

permissions:
  contents: write

concurrency:
  group: investor-control-health-ux-integrate-once
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: investor-control-core-stabilization-v174
          fetch-depth: 0

      - name: Apply deterministic health and UX integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          run_path = Path('market-intelligence/src/run-autonomous-intelligence.js')
          run = run_path.read_text()
          run = replace_once(
              run,
              "import { reconcileOpportunityPurchaseDecisions } from './opportunity-purchase-reconciliation.js';\n",
              "import { reconcileOpportunityPurchaseDecisions } from './opportunity-purchase-reconciliation.js';\nimport { buildOperationalHealth } from './operational-health.js';\n",
              'operational health import',
          )

          calc_pattern = re.compile(
              r"  const analysedCompanyCount = Math\.max\(1, expandedUniverse\.length\);\n"
              r"  const readyHistoricalCount = \(baseReport\.historicalMarketMetrics \|\| \[\]\)\n"
              r"    \.filter\(\(item\) => item\?\.readiness\?\.marketMetricsReady === true\)\.length;\n"
              r"  const marketCoverageRatio = Number\(baseReport\.marketSnapshotCount \|\| 0\) / analysedCompanyCount;\n"
              r"  const historyCoverageRatio = readyHistoricalCount / analysedCompanyCount;\n"
              r"  const fundamentalCoverageRatio = Number\(baseReport\.fundamentalSnapshotCount \|\| 0\) / analysedCompanyCount;\n"
              r"  const blockedDecisionCount = Number\(finalActionCounts\.BLOCKED \|\| 0\);\n"
              r"  const systemStatus = marketCoverageRatio >= 0\.9 && historyCoverageRatio >= 0\.9 && fundamentalCoverageRatio >= 0\.8\n"
              r"    \? 'OPERATIONAL'\n"
              r"    : 'DEGRADED';"
          )
          calc_replacement = """  const analysedCompanyCount = Math.max(1, expandedUniverse.length);
          const readyHistoricalCount = (baseReport.historicalMarketMetrics || [])
            .filter((item) => item?.readiness?.marketMetricsReady === true).length;
          const blockedDecisionCount = Number(finalActionCounts.BLOCKED || 0);
          const operationalHealth = buildOperationalHealth({
            generatedAt,
            analysedCompanyCount,
            marketSnapshotCount: baseReport.marketSnapshotCount,
            historicalMarketMetricsCount: baseReport.historicalMarketMetricsCount,
            readyHistoricalMarketMetricsCount: readyHistoricalCount,
            fundamentalSnapshotCount: baseReport.fundamentalSnapshotCount,
            finalActionCount,
            blockedDecisionCount,
            researchDossierCount: researchDossiers.length,
            unresolvedDiagnosticCount: baseReport.diagnostics.length + (discovery.diagnostics?.length || 0),
          });"""
          run, count = calc_pattern.subn(calc_replacement, run, count=1)
          if count != 1:
              raise SystemExit(f'operational health calculation: expected one replacement, got {count}')

          health_pattern = re.compile(
              r"    operationalHealth: \{\n"
              r"      status: systemStatus,\n"
              r"      infrastructureStatus: 'OPERATIONAL',\n"
              r"      marketDataStatus:.*?\n"
              r"      staleOutput: false,\n",
              re.S,
          )
          run, count = health_pattern.subn("    operationalHealth: {\n      ...operationalHealth,\n", run, count=1)
          if count != 1:
              raise SystemExit(f'operational health report block: expected one replacement, got {count}')
          run_path.write_text(run)

          view_path = Path('mobile/src/OpportunitiesView.js')
          view = view_path.read_text()
          view = replace_once(
              view,
              "  const sourceHealth = feed?.sourceHealth || null;\n  const systemReady = operationalHealth?.status === 'OPERATIONAL'",
              "  const sourceHealth = feed?.sourceHealth || null;\n  const historicalAnalyticsStatus = operationalHealth?.historicalAnalyticsStatus || 'UNAVAILABLE';\n  const historicalAnalyticsPartial = ['PARTIAL', 'UNAVAILABLE'].includes(historicalAnalyticsStatus);\n  const systemReady = operationalHealth?.status === 'OPERATIONAL'",
              'mobile historical analytics state',
          )
          view = replace_once(
              view,
              "freshness.state === 'fresh' ? 'LIVE' : freshness.state === 'stale' ? 'ΠΑΛΙΑ' : 'ΕΛΕΓΧΟΣ'",
              "freshness.state === 'fresh' ? 'ΠΡΟΣΦΑΤΗ' : freshness.state === 'stale' ? 'ΠΑΛΙΑ' : 'ΕΛΕΓΧΟΣ'",
              'freshness badge',
          )
          view = replace_once(
              view,
              "{productionReady ? 'Πλήρης αυτοματοποιημένη λειτουργία' : 'Περιορισμένη λειτουργία — χωρίς αυθαίρετα σήματα'}",
              "{productionReady ? (historicalAnalyticsPartial ? 'Κανονική λειτουργία · μερική ιστορική κάλυψη' : 'Πλήρης αυτοματοποιημένη λειτουργία') : 'Περιορισμένη λειτουργία — χωρίς αυθαίρετα σήματα'}",
              'production health title',
          )
          view = replace_once(
              view,
              "{productionReady ? 'Η ροή είναι πρόσφατη και οι υποχρεωτικοί έλεγχοι αγοράς και θεμελιωδών λειτουργούν.' : 'Το σύστημα συνεχίζει να συλλέγει και να ελέγχει δεδομένα, αλλά δεν εγκρίνει αγορά ή πώληση όταν λείπει πηγή, ιστορικό, benchmark, θεμελιώδη ή διασταύρωση.'}",
              "{productionReady ? (historicalAnalyticsPartial ? 'Η ροή είναι πρόσφατη και οι τρέχοντες έλεγχοι αγοράς και θεμελιωδών λειτουργούν. Η ιστορική ανάλυση είναι διαθέσιμη μόνο όπου έχει επαρκή και επαληθευμένα δεδομένα· οι υπόλοιποι φάκελοι παραμένουν μπλοκαρισμένοι.' : 'Η ροή είναι πρόσφατη και οι υποχρεωτικοί έλεγχοι αγοράς, ιστορικού και θεμελιωδών λειτουργούν.') : 'Το σύστημα συνεχίζει να συλλέγει και να ελέγχει δεδομένα, αλλά δεν εγκρίνει αγορά ή πώληση όταν λείπει πηγή, ιστορικό, benchmark, θεμελιώδη ή διασταύρωση.'}",
              'production health explanation',
          )
          view = replace_once(
              view,
              "Υποδομή: {operationalHealth?.infrastructureStatus || '—'} · Αγορά: {operationalHealth?.marketDataStatus || '—'} · Θεμελιώδη: {operationalHealth?.fundamentalsStatus || '—'} · Αποφάσεις: {operationalHealth?.decisionEngineStatus || '—'}",
              "Υποδομή: {operationalHealth?.infrastructureStatus || '—'} · Τρέχουσα αγορά: {operationalHealth?.marketDataStatus || '—'} · Ιστορική ανάλυση: {historicalAnalyticsStatus} · Θεμελιώδη: {operationalHealth?.fundamentalsStatus || '—'} · Αποφάσεις: {operationalHealth?.decisionEngineStatus || '—'}",
              'health split text',
          )
          view = replace_once(
              view,
              "{sourceHealth?.readyHistoricalMarketMetricsCount || 0}/{sourceHealth?.historicalMarketMetricsCount || 0}</Text><Text style={styles.productionMetricLabel}>Έγκυρα ιστορικά",
              "{sourceHealth?.readyHistoricalMarketMetricsCount || 0}/{operationalHealth?.analysedCompanyCount || sourceHealth?.historicalMarketMetricsCount || 0}</Text><Text style={styles.productionMetricLabel}>Ιστορική κάλυψη",
              'historical coverage metric',
          )
          view_path.write_text(view)

          test_path = Path('mobile/scripts/verify-v172-quote-transparency.js')
          test = test_path.read_text()
          test = replace_once(
              test,
              "const quoteContract = read('src/quote-contract.js');\n",
              "const quoteContract = read('src/quote-contract.js');\nconst opportunities = read('src/OpportunitiesView.js');\n",
              'mobile UX test source',
          )
          insertion = """
          for (const invariant of [
            "freshness.state === 'fresh' ? 'ΠΡΟΣΦΑΤΗ'",
            'historicalAnalyticsStatus',
            'Κανονική λειτουργία · μερική ιστορική κάλυψη',
            'Ιστορική ανάλυση:',
            'operationalHealth?.analysedCompanyCount',
          ]) {
            if (!opportunities.includes(invariant)) throw new Error(`professional intelligence UX invariant missing: ${invariant}`);
          }
          if (opportunities.includes("freshness.state === 'fresh' ? 'LIVE'")) {
            throw new Error('fresh intelligence feed must not be mislabeled as a real-time market quote');
          }
          """
          marker = "\nconst versionParts = String(app.expo.version || '').split('.').map(Number);\n"
          test = replace_once(test, marker, insertion + marker, 'mobile UX assertions')
          test_path.write_text(test)
          PY

          node --check market-intelligence/src/run-autonomous-intelligence.js
          node --check market-intelligence/src/operational-health.js
          node --test market-intelligence/test/operational-health.test.js
          node mobile/scripts/verify-v172-quote-transparency.js
          git diff --check

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-intelligence/src/run-autonomous-intelligence.js mobile/src/OpportunitiesView.js mobile/scripts/verify-v172-quote-transparency.js
          git diff --cached --check
          git commit -m 'feat(ux): separate live health from historical coverage'
          git push origin HEAD:investor-control-core-stabilization-v174
