name: Investor Control Production Intelligence v2

on:
  push:
    branches: [main]
    paths: [.github/workflows/investor-control-production-intelligence-v2.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * 1-5'
    - cron: '37 */6 * * 0,6'

permissions:
  contents: write

concurrency:
  group: investor-control-production-intelligence
  cancel-in-progress: false

env:
  PRODUCTION_SOURCE_SHA: aad8d7f0b4ecc82b3736c55a07c0825e974eb98f
  KV_TITLE: investor-control-market-gateway-minbeis-research-queue
  MARKET_GATEWAY_URL: https://investor-control-market-gateway.bidprice-alerts.workers.dev

jobs:
  autonomous-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout immutable canonical production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable production source provenance
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$PRODUCTION_SOURCE_SHA"
          echo "Canonical production source verified: $ACTUAL_SOURCE_SHA"

      - name: Checkout live publication channel
        uses: actions/checkout@v4
        with:
          ref: investor-control-live-feed
          path: live-feed
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF extraction runtime
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi

      - name: Require canonical server-side credentials
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${FINNHUB_TOKEN:-}" || { echo 'FINNHUB_TOKEN is not configured server-side' >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is not configured server-side' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is not configured server-side' >&2; exit 1; }

      - name: Capture persistent MINBEIS research queue
        id: queue
        working-directory: source/market-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p out
          RESPONSE="$RUNNER_TEMP/kv-namespaces.json"
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100"             > "$RESPONSE"

          KV_ID="$(RESPONSE="$RESPONSE" KV_TITLE="$KV_TITLE" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          if (payload?.success !== true || !Array.isArray(payload?.result)) {
            throw new Error('Cloudflare KV namespace listing failed');
          }
          const wanted = String(process.env.KV_TITLE || '').toLowerCase();
          const matches = payload.result.filter((item) => {
            const title = String(item?.title || '').toLowerCase();
            return title === wanted
              || (title.includes('investor-control-market-gateway')
                && (title.includes('minbeis-research-queue') || title.includes('minbeis_research_queue')));
          });
          if (matches.length !== 1) {
            throw new Error('Expected exactly one MINBEIS research queue namespace, found ' + matches.length);
          }
          process.stdout.write(String(matches[0].id));
          NODE
          )"
          test -n "$KV_ID"
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"

          npx --yes wrangler@4.129.1 kv key list             --namespace-id "$KV_ID"             --remote             --prefix 'research:'             > out/research-queue-keys.json

          node - <<'NODE'
          const fs = require('fs');
          const keys = JSON.parse(fs.readFileSync('out/research-queue-keys.json', 'utf8'));
          const names = (Array.isArray(keys) ? keys : [])
            .map((item) => item?.name)
            .filter((name) => String(name).startsWith('research:'));
          fs.writeFileSync('out/research-queue-key-names.txt', names.join('\n') + (names.length ? '\n' : ''));
          NODE

          : > out/research-queue-values.ndjson
          while IFS= read -r key; do
            test -n "$key" || continue
            VALUE="$(npx --yes wrangler@4.129.1 kv key get "$key" --namespace-id "$KV_ID" --remote --text)"
            printf '%s\n' "$VALUE" >> out/research-queue-values.ndjson
          done < out/research-queue-key-names.txt

          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('out/research-queue-values.ndjson', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean);
          const records = raw.map((line) => JSON.parse(line));
          for (const record of records) {
            if (record?.privacy?.storesPortfolioData !== false
              || record?.privacy?.storesClientIdentity !== false
              || record?.privacy?.storesSymbolOnly !== true) {
              throw new Error('Research queue privacy invariant failed');
            }
          }
          fs.writeFileSync('out/remote-research-queue.json', JSON.stringify({
            format: 'minbeis-remote-research-queue-production',
            version: 1,
            capturedAt: new Date().toISOString(),
            records,
          }, null, 2) + '\n');
          NODE

          rm -f "$RESPONSE" out/research-queue-values.ndjson out/research-queue-key-names.txt out/research-queue-keys.json

      - name: Verify canonical source contracts and deterministic tests
        working-directory: source/market-intelligence
        run: npm test

      - name: Build live MINBEIS intelligence from tested source
        working-directory: source/market-intelligence
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FORECAST_OUTCOME_LEDGER_PATH: ../../live-feed/forecast-outcome-ledger.json
          FORECAST_OUTCOME_LEDGER_OUTPUT: out/forecast-outcome-ledger.json
          MINBEIS_DECISION_OUTCOME_LEDGER_PATH: ../../live-feed/minbeis-decision-outcome-ledger.json
          MINBEIS_DECISION_OUTCOME_LEDGER_OUTPUT: out/minbeis-decision-outcome-ledger.json
          MINBEIS_RESEARCH_QUEUE_PATH: out/remote-research-queue.json
        run: |
          set -euo pipefail
          node src/run-autonomous-intelligence.js out/autonomous-intelligence.json
          node src/build-mobile-feed.js out/autonomous-intelligence.json out/mobile-intelligence-feed.json
          node scripts/verify-production-output.js out/autonomous-intelligence.json out/mobile-intelligence-feed.json
          node scripts/verify-opportunity-hunter-output.js out/autonomous-intelligence.json
          node scripts/verify-forecast-outcome-archive.js out/forecast-outcome-ledger.json
          node scripts/verify-canonical-live-source-connectivity.js out/mobile-intelligence-feed.json out/source-connectivity-audit.json

      - name: Build trusted research queue completion candidate
        working-directory: source/market-intelligence
        run: |
          set -euo pipefail
          node scripts/build-research-queue-completion-plan.js             out/remote-research-queue.json             out/autonomous-intelligence.json             out/research-queue-completion-plan.json
          node scripts/build-research-queue-kv-bulk.js             out/research-queue-completion-plan.json             out/autonomous-intelligence.json             out/research-queue-completion-bulk.json
          node - <<'NODE'
          const fs = require('fs');
          const bulk = JSON.parse(fs.readFileSync('out/research-queue-completion-bulk.json','utf8'));
          if (bulk.mutationAuthority !== 'TRUSTED_PUBLISHER_ONLY' || bulk.publicMutationEndpoint !== false) {
            throw new Error('Research queue mutation authority contract failed');
          }
          console.log(JSON.stringify({ queueCompletionCandidateCount: bulk.updateCount }, null, 2));
          NODE

      - name: Publish verified live feed transactionally
        shell: bash
        run: |
          set -euo pipefail
          git -C live-feed config user.name 'MINBEIS Intelligence'
          git -C live-feed config user.email 'actions@users.noreply.github.com'

          prepare_publication() {
            git -C live-feed rebase --abort >/dev/null 2>&1 || true
            git -C live-feed fetch origin investor-control-live-feed
            git -C live-feed reset --hard origin/investor-control-live-feed

            cp source/market-intelligence/out/mobile-intelligence-feed.json live-feed/mobile-intelligence-feed.json
            cp source/market-intelligence/out/autonomous-intelligence.json live-feed/autonomous-intelligence.json
            cp source/market-intelligence/out/minbeis-decision-outcome-ledger.json live-feed/minbeis-decision-outcome-ledger.json

            node source/market-intelligence/scripts/merge-forecast-outcome-archives.js               live-feed/forecast-outcome-ledger.json               source/market-intelligence/out/forecast-outcome-ledger.json               live-feed/forecast-outcome-ledger.json
            node source/market-intelligence/scripts/verify-forecast-outcome-archive.js               live-feed/forecast-outcome-ledger.json

            node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');
          const feed = JSON.parse(fs.readFileSync('./live-feed/mobile-intelligence-feed.json','utf8'));
          const report = JSON.parse(fs.readFileSync('./live-feed/autonomous-intelligence.json','utf8'));
          const forecastArchive = JSON.parse(fs.readFileSync('./live-feed/forecast-outcome-ledger.json','utf8'));
          const minbeisArchive = JSON.parse(fs.readFileSync('./live-feed/minbeis-decision-outcome-ledger.json','utf8'));
          const pkg = JSON.parse(fs.readFileSync('./source/market-intelligence/package.json','utf8'));
          const now = new Date().toISOString();
          const sourceCommit = execFileSync('git',['-C','source','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const sourcePin = String(process.env.PRODUCTION_SOURCE_SHA || '').trim();
          if (!sourcePin || sourceCommit !== sourcePin) throw new Error('production source provenance mismatch');
          const quotes = Object.values(feed.quoteRegistry || {});
          const missingCurrency = quotes.filter((q) => !q?.currency);
          const unverifiedUsIdentity = quotes.filter((q) =>
            String(q?.appSymbol || '').endsWith('.US') && q?.quoteContract?.identityVerified !== true
          );
          if (missingCurrency.length) throw new Error('canonical registry contains quote(s) without currency');
          if (unverifiedUsIdentity.length) throw new Error('canonical registry contains unverified US identity');
          const forecastSummary = forecastArchive.summary || {};
          const minbeisSummary = minbeisArchive.summary || {};
          const status = {
            format:'investor-control-live-feed-status',
            version:10,
            generatedAt:feed.generatedAt,
            publishedAt:now,
            policyVersion:feed.policyVersion,
            sourcePolicyVersion:feed.sourceSelection?.version || null,
            sourceWorkflowRunId:process.env.GITHUB_RUN_ID,
            sourceCommit,
            sourcePin,
            canonicalSourceVersion:pkg.version,
            runtimeReleaseVersion:pkg.version,
            publisherContract:'CANONICAL_TRANSACTIONAL_V4_MINBEIS_SINGLE_WRITER',
            forecastArchiveContract:'DAILY_OOS_TRANSACTIONAL_V1',
            forecastLearningContract:'LIVE_SHADOW_OOS_RESEARCH_ONLY_V1',
            feedSha256:crypto.createHash('sha256').update(fs.readFileSync('./live-feed/mobile-intelligence-feed.json')).digest('hex'),
            forecastArchiveSha256:crypto.createHash('sha256').update(fs.readFileSync('./live-feed/forecast-outcome-ledger.json')).digest('hex'),
            operationalHealth:{
              ...(report.operationalHealth || {}),
              status:'OPERATIONAL',
              infrastructureStatus:'OPERATIONAL',
              staleOutput:false,
              lastSuccessfulPublicationAt:now,
            },
            counts:feed.summary,
            sourceHealth:{
              canonicalQuoteCount:quotes.length,
              missingCurrencyCount:missingCurrency.length,
              unverifiedUsIdentityCount:unverifiedUsIdentity.length,
              valuationEligibleQuoteCount:quotes.filter((q)=>q?.quoteContract?.valuationEligible===true).length,
              decisionEligibleQuoteCount:quotes.filter((q)=>q?.quoteContract?.decisionEligible===true).length,
              forecastOutcomeRecordCount:Number(forecastSummary.recordCount || 0),
              minbeisDecisionOutcomeRecordCount:Number(minbeisSummary.recordCount || 0),
              queuedResearchRequestedCount:Number(report?.researchQueueResolution?.requestedCount || 0),
              queuedResearchResolvedCount:Number(report?.researchQueueResolution?.resolvedCount || 0),
              queuedResearchBlockedCount:Number(report?.researchQueueResolution?.blockedCount || 0),
            },
          };
          fs.writeFileSync('./live-feed/status.json',JSON.stringify(status,null,2)+'\n');

          let old=[];
          try { old=JSON.parse(fs.readFileSync('./live-feed/decision-history.json','utf8')).items || []; } catch {}
          const current=(feed.decisions || []).map((item)=>({
            recordedAt:now, feedGeneratedAt:feed.generatedAt, policyVersion:feed.policyVersion,
            dossierId:item.id, companyId:item.companyId, companyName:item.companyName, symbol:item.symbol, origin:item.origin,
            marketAction:item.finalAction?.marketAction, holderAction:item.finalAction?.holderAction,
            nonHolderAction:item.finalAction?.nonHolderAction, urgency:item.finalAction?.urgency,
            confidenceScore:item.finalAction?.confidenceScore, dataQualityScore:item.finalAction?.dataQualityScore,
            referencePrice:item.referencePrice, validUntil:item.finalAction?.validUntil,
          }));
          const key=(item)=>`${item.dossierId}|${item.marketAction}|${item.referencePrice?.timestamp || ''}`;
          const seen=new Set(current.map(key));
          fs.writeFileSync('./live-feed/decision-history.json',JSON.stringify({
            format:'investor-control-decision-history',version:2,updatedAt:now,
            items:[...current,...old.filter((item)=>!seen.has(key(item)))].slice(0,500)
          },null,2)+'\n');
          fs.writeFileSync('./live-feed/discovery-radar.json',JSON.stringify({
            format:'investor-control-discovery-radar',version:3,updatedAt:now,
            sourcePolicy:feed.sourceSelection,marketsScanned:report.discovery?.marketsScanned || [],
            items:feed.discoveryRadar
          },null,2)+'\n');
          NODE

            git -C live-feed add               mobile-intelligence-feed.json               autonomous-intelligence.json               forecast-outcome-ledger.json               minbeis-decision-outcome-ledger.json               status.json               decision-history.json               discovery-radar.json

            HAS_CHANGES=0
            if ! git -C live-feed diff --cached --quiet; then
              git -C live-feed commit -m "chore(feed): verified canonical MINBEIS production ${GITHUB_RUN_ID} transactional-v4 [skip ci]"
              HAS_CHANGES=1
            fi
          }

          for attempt in 1 2 3; do
            echo "Transactional publish attempt ${attempt}/3"
            HAS_CHANGES=0
            prepare_publication
            if [ "$HAS_CHANGES" -eq 0 ]; then
              echo 'No publication changes required.'
              exit 0
            fi
            if git -C live-feed push origin HEAD:investor-control-live-feed; then
              echo 'Verified MINBEIS feed published successfully.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Transactional publication failed after 3 clean retries.' >&2
          exit 1

      - name: Verify published remote MINBEIS feed
        shell: bash
        run: |
          set -euo pipefail
          git -C live-feed fetch origin investor-control-live-feed
          git -C live-feed reset --hard origin/investor-control-live-feed

          node source/market-intelligence/scripts/verify-production-output.js             live-feed/autonomous-intelligence.json             live-feed/mobile-intelligence-feed.json
          node source/market-intelligence/scripts/verify-opportunity-hunter-output.js             live-feed/autonomous-intelligence.json
          node source/market-intelligence/scripts/verify-forecast-outcome-archive.js             live-feed/forecast-outcome-ledger.json

          node - <<'NODE'
          const fs=require('fs');
          const status=JSON.parse(fs.readFileSync('./live-feed/status.json','utf8'));
          const report=JSON.parse(fs.readFileSync('./live-feed/autonomous-intelligence.json','utf8'));
          const expected=String(process.env.PRODUCTION_SOURCE_SHA || '').trim();
          if (String(status.sourceWorkflowRunId) !== String(process.env.GITHUB_RUN_ID)) throw new Error('remote status belongs to a different workflow run');
          if (status.publisherContract !== 'CANONICAL_TRANSACTIONAL_V4_MINBEIS_SINGLE_WRITER') throw new Error('MINBEIS publisher marker missing');
          if (status.sourceCommit !== expected || status.sourcePin !== expected) throw new Error('remote source provenance mismatch');
          if (status.operationalHealth?.staleOutput !== false) throw new Error('remote feed marked stale');
          if (Number(report?.researchQueueResolution?.requestedCount || 0) > 0
            && Number(report?.researchQueueResolution?.resolvedCount || 0) < 1) {
            throw new Error('queued research was not resolved into canonical focus universe');
          }
          const nvda=(report.researchDossiers || []).find((d) =>
            String(d?.referencePrice?.appSymbol || d?.marketQuote?.appSymbol || '').toUpperCase() === 'NVDA.US'
          );
          if (Number(report?.researchQueueResolution?.requestedCount || 0) > 0 && !nvda) {
            throw new Error('NVDA.US canonical dossier missing from published production report');
          }
          console.log(JSON.stringify({
            remotePublication:'VERIFIED',
            sourceCommit:status.sourceCommit,
            queuedResearchRequestedCount:status.sourceHealth?.queuedResearchRequestedCount || 0,
            queuedResearchResolvedCount:status.sourceHealth?.queuedResearchResolvedCount || 0,
            nvdaPublished:Boolean(nvda),
          },null,2));
          NODE

      - name: Commit trusted research queue completions after publication
        id: completion
        working-directory: source/market-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: ${{ steps.queue.outputs.kv_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const bulk=JSON.parse(fs.readFileSync('out/research-queue-completion-bulk.json','utf8'));
          if (bulk.mutationAuthority!=='TRUSTED_PUBLISHER_ONLY' || bulk.publicMutationEndpoint!==false) {
            throw new Error('trusted completion authority invalid');
          }
          fs.writeFileSync('out/research-queue-completion-items.json',JSON.stringify(bulk.items || []));
          fs.writeFileSync('out/research-queue-completion-count.txt',String(Number(bulk.updateCount || 0)));
          NODE
          COUNT="$(cat out/research-queue-completion-count.txt)"
          if [ "$COUNT" -eq 0 ]; then
            echo 'No queue completions required.'
            echo "update_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE="$RUNNER_TEMP/kv-bulk-response.json"
          curl --fail --silent --show-error             -X PUT             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @out/research-queue-completion-items.json             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_ID/bulk"             > "$RESPONSE"
          RESPONSE="$RESPONSE" node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync(process.env.RESPONSE,'utf8'));
          if (payload?.success !== true) throw new Error('Cloudflare KV bulk completion write failed');
          NODE
          rm -f "$RESPONSE"
          echo "update_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Verify completed onboarding through live gateway
        if: steps.completion.outputs.update_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="minbeis_publish_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3 4 5 6 7 8; do
            curl --fail --silent --show-error               -H "X-Investor-Control-Client: $CLIENT_ID"               "$MARKET_GATEWAY_URL/v1/research-queue?symbol=NVDA.US" > queue-status.json
            if node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('queue-status.json','utf8')); process.exit(p.requestedSymbol==='NVDA.US'&&p.queueStatus==='COMPLETED'&&p.queued===false?0:1)"; then
              curl --fail --silent --show-error                 -H "X-Investor-Control-Client: $CLIENT_ID"                 "$MARKET_GATEWAY_URL/v1/instrument?symbol=NVDA.US" > instrument.json
              node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('instrument.json','utf8')); if(p.requestedSymbol!=='NVDA.US'||p.analysisSupported!==true||p.onboardingStatus!=='READY'||p.researchEnrollmentStatus!=='COMPLETED') process.exit(1);"
              rm -f queue-status.json instrument.json
              echo 'NVDA.US production onboarding is COMPLETED and READY.'
              exit 0
            fi
            sleep 10
          done
          cat queue-status.json >&2 || true
          echo 'Gateway did not observe completed NVDA.US enrollment within propagation window.' >&2
          exit 1

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-production-intelligence-v2-${{ github.run_id }}
          path: |
            source/market-intelligence/out/autonomous-intelligence.json
            source/market-intelligence/out/mobile-intelligence-feed.json
            source/market-intelligence/out/forecast-outcome-ledger.json
            source/market-intelligence/out/minbeis-decision-outcome-ledger.json
            source/market-intelligence/out/remote-research-queue.json
            source/market-intelligence/out/research-queue-completion-plan.json
            source/market-intelligence/out/research-queue-completion-bulk.json
            source/market-intelligence/out/source-connectivity-audit.json
            live-feed/status.json
          if-no-files-found: warn
          retention-days: 30
