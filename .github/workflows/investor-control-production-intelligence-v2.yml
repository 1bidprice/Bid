name: Investor Control Production Intelligence v2

on:
  push:
    branches: [main]
    paths: [.github/workflows/investor-control-production-intelligence-v2.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * 1-5'
    - cron: '37 */6 * * 0,6'

permissions:
  contents: write

concurrency:
  group: investor-control-production-intelligence
  cancel-in-progress: false

jobs:
  autonomous-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout verified production source
        uses: actions/checkout@v4
        with:
          ref: investor-control-v1-market-intelligence-foundation
          path: source
          fetch-depth: 1

      - name: Checkout live publication channel
        uses: actions/checkout@v4
        with:
          ref: investor-control-live-feed
          path: live-feed
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF extraction runtime
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi

      - name: Apply source contracts and run deterministic tests
        working-directory: source/market-intelligence
        run: npm test

      - name: Build live intelligence from the tested source tree
        working-directory: source/market-intelligence
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: |
          set -euo pipefail
          node src/run-autonomous-intelligence.js out/autonomous-intelligence.json
          node src/build-mobile-feed.js out/autonomous-intelligence.json out/mobile-intelligence-feed.json

      - name: Verify strict production safety
        working-directory: source/market-intelligence
        run: |
          set -euo pipefail
          node scripts/verify-production-output.js out/autonomous-intelligence.json out/mobile-intelligence-feed.json

      - name: Verify opportunity hunter safety
        working-directory: source/market-intelligence
        run: |
          set -euo pipefail
          node scripts/verify-opportunity-hunter-output.js out/autonomous-intelligence.json

      - name: Publish verified live feed transactionally
        shell: bash
        run: |
          set -euo pipefail

          git -C live-feed config user.name 'Investor Control Intelligence'
          git -C live-feed config user.email 'actions@users.noreply.github.com'

          prepare_publication() {
            git -C live-feed rebase --abort >/dev/null 2>&1 || true
            git -C live-feed fetch origin investor-control-live-feed
            git -C live-feed reset --hard origin/investor-control-live-feed

            cp source/market-intelligence/out/mobile-intelligence-feed.json live-feed/mobile-intelligence-feed.json
            cp source/market-intelligence/out/autonomous-intelligence.json live-feed/autonomous-intelligence.json

            node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');
          const feed = JSON.parse(fs.readFileSync('./live-feed/mobile-intelligence-feed.json','utf8'));
          const report = JSON.parse(fs.readFileSync('./live-feed/autonomous-intelligence.json','utf8'));
          const now = new Date().toISOString();
          const sourceCommit = execFileSync('git',['-C','source','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const release = JSON.parse(fs.readFileSync('./source/market-intelligence/config/runtime-release-manifest.json','utf8')).releaseVersion;
          const greek = (report.discovery?.shortlist || []).filter((item) => item.market === 'GR');
          const unresolvedGreek = greek.filter((item) => !item.symbol || item.identityStatus === 'SYMBOL_RESOLUTION_REQUIRED');
          const quotes = Object.values(feed.quoteRegistry || {});
          const readyHistory = (report.historicalMarketMetrics || []).filter((item) => item?.readiness?.marketMetricsReady === true).length;
          const broad = report.broadOpportunityScan || {};
          const hunter = report.opportunityUniverse || {};
          const ranking = hunter.ranking || {};
          const deepQueue = report.opportunityDeepVerificationQueue || [];
          const hunterTelemetry = {
            broadEligibleUniverseCount:Number(broad.directoryEligibleCount || 0),
            fundamentalPoolCount:Number(broad.fundamentalPoolCount || 0),
            fundamentalSelectedCount:Number(broad.fundamentalSelectedCount || 0),
            marketScreenInputCount:Number(broad.marketScreenInputCount || 0),
            marketScreenScorableCount:Number(broad.marketScreenScorableCount || 0),
            marketScreenEligibleCount:Number(broad.marketScreenEligibleCount || 0),
            broadDeepAnalysisCandidateCount:(broad.candidates || []).length,
            specializedOpportunityQuarantineCount:Number(broad.specializedQuarantineCount || 0),
            opportunityScannedInstrumentCount:Number(hunter.uniqueInstrumentCount || 0),
            opportunityScorableInstrumentCount:Number(hunter.scorableInstrumentCount || 0),
            superOpportunityCount:Number(ranking.superOpportunityCount || 0),
            highPriorityOpportunityCount:Number(ranking.highPriorityCount || 0),
            deepVerificationQueueCount:deepQueue.length,
          };
          const status = {
            format:'investor-control-live-feed-status', version:7,
            generatedAt:feed.generatedAt, publishedAt:now,
            policyVersion:feed.policyVersion,
            sourcePolicyVersion:feed.sourceSelection?.version || null,
            sourceWorkflowRunId:process.env.GITHUB_RUN_ID,
            sourceCommit,
            runtimeReleaseVersion:release,
            publisherContract:'TRANSACTIONAL_V2_SINGLE_WRITER',
            feedSha256:crypto.createHash('sha256').update(fs.readFileSync('./live-feed/mobile-intelligence-feed.json')).digest('hex'),
            operationalHealth:{
              ...(report.operationalHealth || {}),
              readyHistoricalMarketMetricsCount:readyHistory,
              greekCandidateCount:greek.length,
              unresolvedGreekIdentityCount:unresolvedGreek.length,
              controlledPlanCount:(report.researchDossiers || []).filter((item)=>item.finalAction?.controlledPlan?.status==='AVAILABLE').length,
              ...hunterTelemetry,
              lastSuccessfulPublicationAt:now,
              staleOutput:false,
            },
            counts:feed.summary,
            sourceHealth:{
              evidenceCount:report.evidenceCount,
              documentReviewedCount:report.documentReviewedCount,
              independentDiscoveryCount:report.independentDiscoveryCount,
              fundamentalSnapshotCount:report.fundamentalSnapshotCount,
              marketSnapshotCount:report.marketSnapshotCount,
              historicalMarketMetricsCount:report.historicalMarketMetricsCount,
              readyHistoricalMarketMetricsCount:readyHistory,
              canonicalQuoteCount:quotes.length,
              valuationEligibleQuoteCount:quotes.filter((q)=>q?.quoteContract?.valuationEligible===true).length,
              decisionEligibleQuoteCount:quotes.filter((q)=>q?.quoteContract?.decisionEligible===true).length,
              marketsScanned:report.discovery?.marketsScanned || [],
              secRegistryCompanyCount:report.discovery?.secRegistryCompanyCount || 0,
              athensActiveIssuerCount:report.discovery?.athensActiveIssuerCount || 0,
              athensAnnouncementEventCount:report.discovery?.athensAnnouncementEventCount || 0,
              greekCandidateCount:greek.length,
              unresolvedGreekIdentityCount:unresolvedGreek.length,
              ...hunterTelemetry,
            },
          };
          fs.writeFileSync('./live-feed/status.json',JSON.stringify(status,null,2)+'\n');

          let old=[];
          try { old=JSON.parse(fs.readFileSync('./live-feed/decision-history.json','utf8')).items || []; } catch {}
          const current=(feed.decisions || []).map((item)=>({
            recordedAt:now, feedGeneratedAt:feed.generatedAt, policyVersion:feed.policyVersion,
            dossierId:item.id, companyId:item.companyId, companyName:item.companyName, symbol:item.symbol, origin:item.origin,
            marketAction:item.finalAction?.marketAction, holderAction:item.finalAction?.holderAction,
            nonHolderAction:item.finalAction?.nonHolderAction, urgency:item.finalAction?.urgency,
            confidenceScore:item.finalAction?.confidenceScore, dataQualityScore:item.finalAction?.dataQualityScore,
            referencePrice:item.referencePrice, validUntil:item.finalAction?.validUntil,
          }));
          const key=(item)=>`${item.dossierId}|${item.marketAction}|${item.referencePrice?.timestamp || ''}`;
          const seen=new Set(current.map(key));
          fs.writeFileSync('./live-feed/decision-history.json',JSON.stringify({format:'investor-control-decision-history',version:2,updatedAt:now,items:[...current,...old.filter((item)=>!seen.has(key(item)))].slice(0,500)},null,2)+'\n');
          fs.writeFileSync('./live-feed/discovery-radar.json',JSON.stringify({format:'investor-control-discovery-radar',version:3,updatedAt:now,sourcePolicy:feed.sourceSelection,marketsScanned:report.discovery?.marketsScanned || [],items:feed.discoveryRadar},null,2)+'\n');
          NODE

            git -C live-feed add mobile-intelligence-feed.json autonomous-intelligence.json status.json decision-history.json discovery-radar.json
            HAS_CHANGES=0
            if ! git -C live-feed diff --cached --quiet; then
              git -C live-feed commit -m "chore(feed): verified hunter production ${GITHUB_RUN_ID} transactional-v2 [skip ci]"
              HAS_CHANGES=1
            fi
          }

          for attempt in 1 2 3; do
            echo "Transactional publish attempt ${attempt}/3"
            HAS_CHANGES=0
            prepare_publication
            if [ "$HAS_CHANGES" -eq 0 ]; then
              echo 'No publication changes required.'
              exit 0
            fi
            if git -C live-feed push origin HEAD:investor-control-live-feed; then
              echo 'Verified feed published successfully.'
              exit 0
            fi
            echo 'Remote changed before push; rebuilding publication from the newest remote base.'
            sleep $((attempt * 2))
          done

          echo 'Transactional publication failed after 3 clean retries.' >&2
          exit 1

      - name: Verify published remote feed
        shell: bash
        run: |
          set -euo pipefail
          git -C live-feed fetch origin investor-control-live-feed
          LOCAL_HEAD="$(git -C live-feed rev-parse HEAD)"
          REMOTE_HEAD="$(git -C live-feed rev-parse origin/investor-control-live-feed)"
          test "$LOCAL_HEAD" = "$REMOTE_HEAD"
          git -C live-feed reset --hard origin/investor-control-live-feed

          node source/market-intelligence/scripts/verify-production-output.js \
            live-feed/autonomous-intelligence.json \
            live-feed/mobile-intelligence-feed.json
          node source/market-intelligence/scripts/verify-opportunity-hunter-output.js \
            live-feed/autonomous-intelligence.json

          node - <<'NODE'
          const fs=require('fs');
          const status=JSON.parse(fs.readFileSync('./live-feed/status.json','utf8'));
          const report=JSON.parse(fs.readFileSync('./live-feed/autonomous-intelligence.json','utf8'));
          const broad=report.broadOpportunityScan || {};
          const hunter=report.opportunityUniverse || {};
          const ranking=hunter.ranking || {};
          if (String(status.sourceWorkflowRunId) !== String(process.env.GITHUB_RUN_ID)) throw new Error('remote status belongs to a different workflow run');
          if (status.publisherContract !== 'TRANSACTIONAL_V2_SINGLE_WRITER') throw new Error('single-writer transactional publisher marker missing');
          if (status.generatedAt !== report.generatedAt) throw new Error('remote status/report generation mismatch');
          if (status.operationalHealth?.staleOutput !== false) throw new Error('remote feed incorrectly marked stale');
          if (Number(status.sourceHealth?.marketScreenScorableCount || 0) !== Number(broad.marketScreenScorableCount || 0)) throw new Error('remote market-screen telemetry mismatch');
          if (Number(status.sourceHealth?.superOpportunityCount || 0) !== Number(ranking.superOpportunityCount || 0)) throw new Error('remote super-opportunity telemetry mismatch');
          console.log(JSON.stringify({
            remotePublication:'VERIFIED',
            sourceWorkflowRunId:status.sourceWorkflowRunId,
            sourceCommit:status.sourceCommit,
            runtimeReleaseVersion:status.runtimeReleaseVersion,
            publisherContract:status.publisherContract,
            broadEligibleUniverseCount:status.sourceHealth?.broadEligibleUniverseCount || 0,
            fundamentalSelectedCount:status.sourceHealth?.fundamentalSelectedCount || 0,
            marketScreenScorableCount:status.sourceHealth?.marketScreenScorableCount || 0,
            broadDeepAnalysisCandidateCount:status.sourceHealth?.broadDeepAnalysisCandidateCount || 0,
            opportunityScorableInstrumentCount:status.sourceHealth?.opportunityScorableInstrumentCount || 0,
            superOpportunityCount:status.sourceHealth?.superOpportunityCount || 0,
            highPriorityOpportunityCount:status.sourceHealth?.highPriorityOpportunityCount || 0,
          },null,2));
          NODE

      - name: Record failure heartbeat safely
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -d live-feed/.git || exit 0
          git -C live-feed config user.name 'Investor Control Intelligence'
          git -C live-feed config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            git -C live-feed rebase --abort >/dev/null 2>&1 || true
            git -C live-feed fetch origin investor-control-live-feed
            git -C live-feed reset --hard origin/investor-control-live-feed

            node - <<'NODE'
          const fs=require('fs');
          let status={format:'investor-control-live-feed-status',version:7};
          try { status=JSON.parse(fs.readFileSync('./live-feed/status.json','utf8')); } catch {}
          const now=new Date().toISOString();
          status.publishedAt=now;
          status.lastFailureAt=now;
          status.lastFailureWorkflowRunId=process.env.GITHUB_RUN_ID;
          status.operationalHealth={...(status.operationalHealth||{}),status:'FAILED',infrastructureStatus:'FAILED',staleOutput:true,lastFailureAt:now};
          fs.writeFileSync('./live-feed/status.json',JSON.stringify(status,null,2)+'\n');
          NODE

            git -C live-feed add status.json
            if git -C live-feed diff --cached --quiet; then exit 0; fi
            git -C live-feed commit -m "chore(feed): production failure ${GITHUB_RUN_ID} safe-heartbeat [skip ci]"
            if git -C live-feed push origin HEAD:investor-control-live-feed; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Could not record failure heartbeat after 3 clean retries.' >&2
          exit 1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-production-intelligence-v2-${{ github.run_id }}
          path: |
            source/market-intelligence/out/autonomous-intelligence.json
            source/market-intelligence/out/mobile-intelligence-feed.json
            live-feed/status.json
          if-no-files-found: warn
          retention-days: 30
