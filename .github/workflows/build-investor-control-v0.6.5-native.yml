name: Signed Investor Control v0.6.5 Native APK

on:
  push:
    branches:
      - investor-control-v0.6.5-native-ui-fix
    paths:
      - .github/workflows/build-investor-control-v0.6.5-native.yml
  pull_request:
    branches:
      - investor-control-v0.6.4-market-baseline
    paths:
      - mobile/**
      - .github/workflows/build-investor-control-v0.6.5-native.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investor-control-v065-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout native v0.6.5 branch
        uses: actions/checkout@v4
        with:
          ref: investor-control-v0.6.5-native-ui-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Apply v0.6.5 native UI correction
        working-directory: mobile
        run: node scripts/apply-v065-native-ui-fix.js

      - name: Verify source invariants
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const VERSION = '0.6.5';" PortfolioApp.js
          grep -q "const VERSION = '0.6.5';" DecisionOverlay.js
          grep -q "useSafeAreaInsets" DecisionOverlay.js
          grep -q "bottom: 92 + insets.bottom" DecisionOverlay.js
          grep -q "SafeAreaProvider initialMetrics={initialWindowMetrics}" App.js
          node - <<'NODE'
          const app = require('./app.json');
          const pkg = require('./package.json');
          if (app.expo.version !== '0.6.5') throw new Error('wrong Expo version');
          if (app.expo.android.package !== 'gr.investorcontrol.app') throw new Error('wrong package');
          if (app.expo.android.versionCode !== 13) throw new Error('wrong versionCode');
          if (pkg.version !== '0.6.5') throw new Error('wrong package version');
          console.log('PASS v0.6.5 package and safe-area invariants');
          NODE

      - name: Commit corrected native source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Investor Control CI'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile/App.js mobile/DecisionOverlay.js mobile/PortfolioApp.js mobile/app.json mobile/package.json
          if git diff --cached --quiet; then
            echo 'Native source already patched'
          else
            git commit -m 'fix(mobile): apply v0.6.5 Android safe-area correction [skip ci]'
            git pull --rebase origin investor-control-v0.6.5-native-ui-fix
            git push origin HEAD:investor-control-v0.6.5-native-ui-fix
          fi

      - name: Expo Doctor diagnostic
        continue-on-error: true
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        id: gradle
        continue-on-error: true
        working-directory: mobile/android
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-v0.6.5.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist Gradle failure diagnosis
        if: steps.gradle.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/build-metadata
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "source_commit=${GITHUB_SHA}"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            tail -n 300 mobile/gradle-v0.6.5.log
          } > .github/build-metadata/investor-control-v0.6.5-gradle-failure.log
          git config user.name 'Investor Control CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/build-metadata/investor-control-v0.6.5-gradle-failure.log
          git commit -m 'chore(mobile): record v0.6.5 Gradle failure [skip ci]'
          git pull --rebase origin investor-control-v0.6.5-native-ui-fix
          git push origin HEAD:investor-control-v0.6.5-native-ui-fix
          exit 1

      - name: Sign and verify update APK
        if: steps.gradle.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED='mobile/android/app/build/outputs/apk/release/app-release.apk'
          KEYSTORE='mobile/android/app/debug.keystore'
          OUTPUT='mobile/Investor-Control-v0.6.5.apk'
          ALIGNED='mobile/Investor-Control-v0.6.5-aligned.apk'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -s "$UNSIGNED"
          test -s "$KEYSTORE"
          unzip -l "$UNSIGNED" | grep -q 'assets/index.android.bundle'
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee mobile/Investor-Control-v0.6.5-signature.txt
          grep -qi 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' mobile/Investor-Control-v0.6.5-signature.txt
          unzip -l "$OUTPUT" | grep -q 'assets/index.android.bundle'
          sha256sum "$OUTPUT" | tee mobile/Investor-Control-v0.6.5.sha256

      - name: Upload signed v0.6.5 APK
        if: steps.gradle.outputs.exit_code == '0'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: investor-control-v0.6.5-native-signed-apk
          path: |
            mobile/Investor-Control-v0.6.5.apk
            mobile/Investor-Control-v0.6.5.sha256
            mobile/Investor-Control-v0.6.5-signature.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish build metadata
        if: steps.gradle.outputs.exit_code == '0'
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-metadata
          SHA256_VALUE="$(cut -d' ' -f1 mobile/Investor-Control-v0.6.5.sha256)"
          cat > .github/build-metadata/investor-control-v0.6.5-current-run.txt <<EOF
          status=SIGNED_AND_VERIFIED
          version=0.6.5
          versionCode=13
          package=gr.investorcontrol.app
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          source_commit=${GITHUB_SHA}
          artifact_id=${ARTIFACT_ID}
          artifact_name=investor-control-v0.6.5-native-signed-apk
          artifact_url=${ARTIFACT_URL}
          apk_sha256=${SHA256_VALUE}
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'Investor Control CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/build-metadata/investor-control-v0.6.5-current-run.txt
          git commit -m 'chore(mobile): record verified v0.6.5 APK [skip ci]'
          git pull --rebase origin investor-control-v0.6.5-native-ui-fix
          git push origin HEAD:investor-control-v0.6.5-native-ui-fix
